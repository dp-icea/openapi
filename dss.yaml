openapi: 3.0.2
info:
  title: DSS
  version: 1.0.0
  description: |
    O DSS (Discovery and Synchronization Service) é o serviço do BR-UTM em que os SW-USS descobrem uns aos outros. Ele não guarda os detalhes das operações, só **referências**: onde e quando existe uma entidade, qual SW-USS a gerencia e a URL (`uss_base_url`) em que os detalhes podem ser obtidos diretamente com esse SW-USS.

    ## Arquitetura

    O DSS é um serviço do BR-UTM, escrito em Go e derivado do DSS da InterUSS, com modificações próprias. Ele fica atrás do API Gateway, que encaminha os caminhos `/dss` e `/rid/v2/dss` para o serviço, e roda em várias réplicas sem estado. Todo o estado fica em um banco **CockroachDB** (SQL distribuído), e cada escrita é feita em uma transação.

    ### Como uma referência é guardada

    O DSS não guarda os volumes que recebe em `extents`. Ele os reduz a um envelope aproximado, e é só isso que fica gravado:

    - **Área:** a união dos contornos de todos os volumes é convertida em um conjunto de **células S2** de nível 13, com cerca de 1 km² cada. O S2 divide a superfície da Terra em uma hierarquia de células, e cada célula é identificada por um inteiro de 64 bits. Círculos são aproximados por um polígono de 20 lados antes da conversão.
    - **Altitude:** um único intervalo, da menor `altitude_lower` à maior `altitude_upper` entre os volumes.
    - **Tempo:** um único intervalo, do menor `time_start` ao maior `time_end`.
    - **Demais campos:** ID, `manager` (o `sub` do token de quem criou), versão, OVN, `uss_base_url`, estado e a subscription associada.

    As células ficam em uma coluna de inteiros com índice invertido. Uma consulta converte a área pedida em células S2 da mesma forma e devolve as referências que **compartilham pelo menos uma célula** com ela e cujos intervalos de altitude e de tempo se sobrepõem aos pedidos.

    Consequências para quem integra:

    1. **O DSS não conhece a geometria exata.** Uma referência devolvida pode não intersectar de fato a área consultada. A verificação exata é feita pelo SW-USS, com os detalhes obtidos no SW-USS que gerencia a entidade.
    2. **Os volumes enviados ao DSS não precisam ser os exatos.** Um volume envolvente basta, desde que contenha todos os volumes (nominais e off-nominal) da operação.
    3. **Limites:** polígonos de no máximo 2.500 km²; no máximo 10.000 operational intents por consulta.

    ### Subscriptions e notificações

    Uma subscription é uma área e um intervalo de tempo em que um SW-USS quer ser avisado de mudanças. **O DSS não envia notificações.** Quando um SW-USS cria, altera ou remove uma referência, o DSS procura as subscriptions que se sobrepõem à área nova e à antiga, incrementa o `notification_index` de cada uma e devolve a lista em `subscribers`. Quem fez a alteração notifica cada SW-USS da lista diretamente, nos endpoints `POST` de `sw-uss.yaml`. A lista inclui as subscriptions do próprio SW-USS.

    Ao criar ou atualizar uma operational intent, o SW-USS pode pedir uma **subscription implícita** (`new_subscription`): o DSS a cria cobrindo a operação e a remove junto com a operational intent. Nas atualizações seguintes, envie o `subscription_id` dessa subscription para mantê-la (o DSS a amplia se a operação crescer). Uma atualização sem `subscription_id` e sem `new_subscription` deixa a operational intent sem subscription, o que só é aceito no estado `Accepted`.

    ### OVN e `key`: prova de que o espaço aéreo foi lido

    Cada versão de uma referência tem um OVN (*opaque version number*) gerado pelo DSS. O DSS só mostra o OVN ao `manager` da referência; para os demais SW-USS, o campo vem como `Available from USS`, e o OVN verdadeiro só é obtido nos detalhes, com o SW-USS que gerencia a entidade.

    Ao criar ou alterar uma operational intent em `Accepted` ou `Activated`, o SW-USS envia em `key` os OVNs das operational intents que se sobrepõem à nova pelo critério de células, altitude e tempo e, se a subscription associada pede notificações de constraints (`notify_for_constraints`), também os OVNs das constraints. Se faltar algum, o DSS responde `409` com a lista do que falta. Assim, o DSS garante que nenhum SW-USS escreve sem ter lido o estado atual do espaço aéreo.

    ### Constraints

    Constraints são restrições do espaço aéreo; na Fase 1, só o DECEA as cria. Todo SW-USS que opera voos deve:

    1. **Pedir notificações de constraints.** Ao criar a operational intent, envie `new_subscription` com `notify_for_constraints: true` (ou use uma subscription sua com `notify_for_constraints: true`). Isso exige o escopo `utm.constraint_processing` no token, junto com `utm.strategic_coordination`. Assim, o SW-USS recebe `POST /uss/v1/constraints` quando uma constraint da área muda, e o DSS passa a exigir na `key` os OVNs das constraints da área.
    2. **Verificar sempre se a operational intent intersecta alguma constraint**, com os volumes exatos obtidos no SW-USS Gerenciador de Constraints. Uma operational intent que intersecta uma constraint não pode ser ativada.

    ## Autenticação

    Todas as operações exigem `Authorization: Bearer <token>`, com um token obtido em `GET /token` (ver `token.yaml`):

    - `intended_audience`: o domínio do DSS, isto é, o host da URL base (ex.: `api.sandbox.brutm.icea.decea.mil.br`).
    - `scope`: cada operação aceita um ou mais conjuntos de escopos, listados em `security` e no início da sua descrição. O token precisa conter todos os escopos de pelo menos um dos conjuntos.
    - O `sub` do token vira o `manager` (ou `owner`) das entidades criadas, e só ele pode alterá-las ou removê-las.

    Os erros vêm no corpo como `{"message": "..."}`.

    ## Schemas

    Schemas do Remote ID com o mesmo nome de um schema UTM, mas conteúdo diferente, recebem o prefixo `Rid` (ex.: `RidVolume4D`). Os operationIds de subscription do Remote ID também (ex.: `getRidSubscription`).
servers:
- url: http://api.sandbox.brutm.icea.decea.mil.br
  description: Desenvolvimento (somente HTTP, sem TLS)
- url: https://eco-utm.decea.mil.br
  description: Produção
security:
- Authority:
  - utm.strategic_coordination
  - utm.conformance_monitoring_sa
  - utm.constraint_processing
  - utm.constraint_management
  - utm.availability_arbitration
  - rid.display_provider
  - rid.service_provider
