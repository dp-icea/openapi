        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            * O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint ou à requisição.
            * O cliente pediu notificações de um tipo de entidade a que os escopos do token não dão acesso.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            * Já existe uma subscription com o ID informado.
            * Apesar de várias tentativas, o DSS não conseguiu concluir a alteração por causa de outras alterações simultâneas.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O cliente pode ter feito requisições demais em pouco tempo.
