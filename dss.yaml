components:
  securitySchemes:
    Authority:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /token
          scopes:
            utm.strategic_coordination: >-
              O cliente pode executar as ações do papel Strategic Coordination, incluindo a detecção estratégica de conflitos.
            utm.conformance_monitoring_sa: >-
              O cliente pode executar as ações do papel Conformance Monitoring for Situational Awareness (CMSA).
            utm.constraint_processing: >-
              O cliente pode ler referências de constraints no DSS e os detalhes nos SW-USS parceiros, conforme o papel Constraint Processing.
            utm.constraint_management: >-
              O cliente pode gerenciar (criar, editar e remover) constraints, conforme o papel Constraint Management.
            utm.availability_arbitration: >-
              O cliente pode definir o estado de disponibilidade dos SW-USS no DSS.
            rid.display_provider: O cliente pode consultar, ler ou criar subscriptions de Identification Service Areas do Remote ID. Um Display Provider deve receber este escopo quando o pedir.
            rid.service_provider: O cliente pode criar, editar e remover Identification Service Areas do Remote ID. Um Service Provider deve receber este escopo quando o pedir.
      description: |
        Token de acesso JWT emitido pelo Auth Server do BR-UTM em `GET /token` (ver `token.yaml`), a partir da chave de API da empresa. O tipo `oauth2` é usado aqui só para declarar os escopos de cada operação: o BR-UTM não usa o fluxo OAuth *client credentials*.

        Envie o token no header `Authorization: Bearer <token>`. O DSS verifica:

        * a assinatura RS256, com a chave pública do Auth Server;
        * `aud`: deve ser um dos audiences aceitos pelo DSS (o domínio do DSS);
        * `sub` e `iss` preenchidos, e `exp` no máximo 1 hora no futuro;
        * `scope`: deve conter todos os escopos de pelo menos uma das alternativas listadas em `security` na operação.

        O `sub` do token identifica a empresa e vira o `manager` (ou `owner`) das entidades que ela cria no DSS.
  schemas:
    UUIDv4Format:
      description: >-
        Texto no formato de um UUID versão 4, conforme a RFC 4122.
      maxLength: 36
      minLength: 36
      type: string
      format: uuid
      pattern: >-
        ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      example: 03e5572a-f733-49af-bc14-8a18bd53ee39
    EntityID:
      description: >-
        Identificador de uma entidade comunicada pelo DSS, no formato UUIDv4.
      anyOf:
      - $ref: '#/components/schemas/UUIDv4Format'
      example: 2f8343be-6482-4d1b-a474-16847e01af1e
    EntityOVN:
      title: EntityOVN
      description: >-
        Token associado a uma versão específica de uma entidade UTM, criado pelo DSS quando a referência da entidade é criada ou alterada, e entregue ao cliente que fez a alteração. O DSS guarda o EntityOVN de forma privada e o compara com os itens da `key` enviada nas escritas no espaço aéreo. O cliente também informa o EntityOVN sempre que transmite as informações completas da entidade (em um GET ou em uma notificação de subscription).
      type: string
      minLength: 16
      maxLength: 128
      example: v.v5qNvwU.VccnOCgBA-CEfqltpTC-3qN-2iKbRusEQ_
    EntityVersion:
      title: EntityVersion
      description: >-
        Versão numérica da entidade, incrementada a cada alteração, mesmo que nenhum campo mude. Um SW-USS que já tem os detalhes de uma versão não precisa buscá-los de novo até a versão mudar.
      type: integer
      format: int32
      example: 1
    SubscriptionID:
      description: >-
        Identificador de uma subscription comunicada pelo DSS, no formato UUIDv4.
      anyOf:
      - $ref: '#/components/schemas/UUIDv4Format'
      example: 78ea3fe8-71c2-4f5c-9b44-9c02f5563c6f
    Key:
      description: >-
        Prova de que o cliente obteve o conteúdo mais recente do espaço aéreo, usada para garantir que escritas no DSS só aconteçam quando esse conteúdo é conhecido (foi lido). O cliente deve enviar uma `key` atual, montada a partir de leituras anteriores, das consultas de informações completas que se seguiram e, opcionalmente, de notificações de subscriptions. O conteúdo desta estrutura, uma lista de OVNs, é gerado pelo cliente.
      type: array
      items:
        $ref: '#/components/schemas/EntityOVN'
      default: []
    Time:
      required:
      - value
      - format
      type: object
      properties:
        value:
          type: string
          description: >-
            Data e hora no formato RFC 3339. O fuso horário deve ser 'Z'.
          format: date-time
          example: '2026-11-05T14:00:00Z'
        format:
          type: string
          enum:
          - RFC3339
    Radius:
      required:
      - value
      - units
      type: object
      properties:
        value:
          format: float
          description: >-
            Distância a partir do centro de uma área circular, sobre o elipsoide WGS84.
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 300
        units:
          type: string
          description: >-
            Unidades compatíveis com FIXM. No UTM, só metros ("M") são aceitos.
          enum:
          - M
    Altitude:
      type: object
      required:
      - value
      - reference
      - units
      properties:
        value:
          description: >-
            Valor numérico da altitude. Os valores mínimo e máximo servem como verificação de sanidade e podem ser revistos à medida que novas unidades ou referenciais forem permitidos.
          type: number
          format: double
          minimum: -8000
          exclusiveMinimum: false
          maximum: 100000
          exclusiveMaximum: false
          example: 120
        reference:
          description: >-
            Código do referencial da distância vertical. Ver AIXM 5.1 e FIXM 4.2.0. Hoje o UTM só aceita WGS84, sem planos imediatos de aceitar outros. FIXM e AIXM aceitam 'SFC', equivalente a AGL.
          type: string
          enum:
          - W84
        units:
          description: >-
            Unidade usada para expressar a altitude. Ver FIXM 4.2. Hoje o UTM só aceita metros, sem planos imediatos de aceitar outras.
          type: string
          enum:
          - M
    Latitude:
      description: >-
        Graus de latitude ao norte do equador, em relação ao elipsoide WGS84.
      maximum: 90
      exclusiveMaximum: false
      minimum: -90
      exclusiveMinimum: false
      type: number
      format: double
      example: -23.5505
    Longitude:
      description: >-
        Graus de longitude a leste do meridiano de Greenwich, em relação ao elipsoide WGS84.
      minimum: -180
      exclusiveMaximum: false
      maximum: 180
      exclusiveMinimum: false
      type: number
      format: double
      example: -46.6333
    Polygon:
      description: >-
        Área fechada sobre a Terra. As arestas do polígono são os caminhos mais curtos entre vértices consecutivos. Isso significa, por exemplo, que a aresta entre dois pontos de mesma latitude em geral não fica sobre essa latitude. A ordem dos vértices deve ser interpretada como a que produz a menor área. As arestas não podem se cruzar e os vértices não podem se repetir; em particular, o último vértice não pode ser igual ao primeiro.
      required:
      - vertices
      type: object
      properties:
        vertices:
          minItems: 3
          type: array
          items:
            $ref: '#/components/schemas/LatLngPoint'
    LatLngPoint:
      description: Ponto na superfície da Terra.
      required:
      - lat
      - lng
      type: object
      properties:
        lng:
          $ref: '#/components/schemas/Longitude'
        lat:
          $ref: '#/components/schemas/Latitude'
    Circle:
      description: Área circular na superfície da Terra.
      type: object
      properties:
        center:
          $ref: '#/components/schemas/LatLngPoint'
        radius:
          $ref: '#/components/schemas/Radius'
    Volume3D:
      description: >-
        Volume geográfico tridimensional formado pela extrusão vertical de uma forma. Deve ser informado exatamente um contorno.
      type: object
      properties:
        outline_circle:
          anyOf:
          - $ref: '#/components/schemas/Circle'
          description: Forma geográfica circular na superfície da Terra.
        outline_polygon:
          anyOf:
          - $ref: '#/components/schemas/Polygon'
          description: >-
            Forma geográfica poligonal na superfície da Terra.
        altitude_lower:
          description: >-
            Altitude mínima do volume. Se informada, deve ser menor que `altitude_upper`.
          anyOf:
          - $ref: '#/components/schemas/Altitude'
        altitude_upper:
          description: >-
            Altitude máxima do volume. Se informada, deve ser maior que `altitude_lower`.
          anyOf:
          - $ref: '#/components/schemas/Altitude'
    Volume4D:
      description: Bloco contínuo de espaço-tempo geográfico.
      required:
      - volume
      type: object
      properties:
        volume:
          $ref: '#/components/schemas/Volume3D'
        time_start:
          description: Início do volume. Deve ser anterior a `time_end`.
          anyOf:
          - $ref: '#/components/schemas/Time'
        time_end:
          description: Fim do volume. Deve ser posterior a `time_start`.
          anyOf:
          - $ref: '#/components/schemas/Time'
    ErrorResponse:
      description: >-
        Texto legível devolvido quando uma transação entre SW-USS e DSS resulta em erro.
      type: object
      properties:
        message:
          description: >-
            Mensagem legível que indica o erro e/ou o motivo.
          type: string
          example: OperationalIntents may not end in the past
    SubscriptionState:
      description: >-
        Estado da subscription que motivou o envio de uma notificação.
      required:
      - subscription_id
      - notification_index
      type: object
      properties:
        subscription_id:
          $ref: '#/components/schemas/SubscriptionID'
        notification_index:
          $ref: '#/components/schemas/SubscriptionNotificationIndex'
    SubscriberToNotify:
      description: >-
        Subscriber que deve ser notificado de uma mudança no espaço aéreo. O DSS informa os subscribers ao cliente que alterou o espaço aéreo, e cabe a esse cliente enviar a notificação ao SW-USS indicado, de acordo com a alteração feita.
      required:
      - subscriptions
      - uss_base_url
      type: object
      properties:
        subscriptions:
          description: Subscription(s) que motivaram esta notificação.
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionState'
          minItems: 1
        uss_base_url:
          $ref: '#/components/schemas/SubscriptionUssBaseURL'
    Subscription:
      description: >-
        Área geográfica pela qual um cliente tem interesse contínuo (por exemplo, uma "área de planejamento").
      required:
      - id
      - version
      - notification_index
      - uss_base_url
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SubscriptionID'
        version:
          description: >-
            Versão da subscription, alterada pelo DSS sempre que um SW-USS altera a subscription. O incremento do `notification_index` pelo DSS não gera nova versão. O SW-USS deve informar esta versão ao alterar uma subscription existente, para garantir consistência em leituras-alterações-escritas e em sistemas distribuídos.
          type: string
          example: RrDXHiEknrlVXOo-hUYyT1wi-jTTcpZbk9UI.fJbiac_
        notification_index:
          $ref: '#/components/schemas/SubscriptionNotificationIndex'
        time_start:
          description: >-
            Se informado, a subscription não recebe notificações de mudanças no espaço aéreo que ocorram inteiramente antes deste instante.
          anyOf:
          - $ref: '#/components/schemas/Time'
        time_end:
          description: >-
            Se informado, a subscription não recebe notificações de mudanças no espaço aéreo que ocorram inteiramente depois deste instante.
          anyOf:
          - $ref: '#/components/schemas/Time'
        uss_base_url:
          $ref: '#/components/schemas/SubscriptionUssBaseURL'
        notify_for_operational_intents:
          description: >-
            Se verdadeiro, gera notificações quando operational intents são criadas, alteradas ou removidas. Caso contrário, mudanças em operational intents não geram notificações. Qualquer um dos escopos aceitos pela operação (`utm.strategic_coordination` ou `utm.constraint_processing`) permite ativar esta opção.
          type: boolean
          default: false
        notify_for_constraints:
          description: >-
            Se verdadeiro, gera notificações quando constraints são criadas, alteradas ou removidas. Caso contrário, mudanças em constraints não geram notificações. Qualquer um dos escopos aceitos pela operação (`utm.strategic_coordination` ou `utm.constraint_processing`) permite ativar esta opção.
          type: boolean
          default: false
        implicit_subscription:
          description: >-
            Verdadeiro se a subscription foi criada implicitamente pelo DSS junto com uma operational intent, e por isso deve ser removida pelo DSS quando essa operational intent for removida.
          type: boolean
          default: false
        dependent_operational_intents:
          description: >-
            IDs das operational intents que dependem desta subscription.
          type: array
          items:
            $ref: '#/components/schemas/EntityID'
          default: []
    SubscriptionNotificationIndex:
      format: int32
      description: >-
        Contador das notificações enviadas para uma subscription, para que o subscriber perceba com mais facilidade notificações perdidas.
      type: integer
      minimum: 0
      exclusiveMinimum: false
      default: 0
    QuerySubscriptionParameters:
      description: >-
        Parâmetros de uma requisição para buscar subscriptions que atendam aos critérios informados.
      type: object
      properties:
        area_of_interest:
          $ref: '#/components/schemas/Volume4D'
    QuerySubscriptionsResponse:
      description: >-
        Resposta do DSS a uma consulta de subscriptions em uma área geográfica.
      required:
      - subscriptions
      type: object
      properties:
        subscriptions:
          description: >-
            Subscriptions que se sobrepõem à área geográfica informada.
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
          default: []
    GetSubscriptionResponse:
      description: >-
        Resposta do DSS a uma requisição da subscription com o ID informado.
      required:
      - subscription
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/Subscription'
    PutSubscriptionParameters:
      description: >-
        Parâmetros de uma requisição para criar ou atualizar uma subscription no DSS. Pelo menos um tipo de notificação deve ser pedido.
      required:
      - extents
      - uss_base_url
      type: object
      properties:
        extents:
          description: |
            Volumes espaço-temporais da área de interesse.
            A subscription é removida automaticamente depois do seu fim, se não for renovada antes. Se o fim não for informado, o DSS escolhe o valor. Se o início não for informado, vale o momento em que a requisição é processada. O fim não pode estar no passado.
            Algumas entidades que geram notificações podem estar inteiramente fora da área pedida.
          anyOf:
          - $ref: '#/components/schemas/Volume4D'
        uss_base_url:
          $ref: '#/components/schemas/SubscriptionUssBaseURL'
        notify_for_operational_intents:
          description: >-
            Se verdadeiro, gera notificações quando operational intents são criadas, alteradas ou removidas. Caso contrário, mudanças em operational intents não geram notificações. Qualquer um dos escopos aceitos pela operação (`utm.strategic_coordination` ou `utm.constraint_processing`) permite ativar esta opção.
          type: boolean
          default: false
        notify_for_constraints:
          description: >-
            Se verdadeiro, gera notificações quando constraints são criadas, alteradas ou removidas. Caso contrário, mudanças em constraints não geram notificações. Qualquer um dos escopos aceitos pela operação (`utm.strategic_coordination` ou `utm.constraint_processing`) permite ativar esta opção.
          type: boolean
          default: false
    SubscriptionUssBaseURL:
      description: >-
        URL base da implementação, no SW-USS, das partes da API entre SW-USS necessárias para receber as notificações pedidas por esta subscription.
      anyOf:
      - $ref: '#/components/schemas/UssBaseURL'
    PutSubscriptionResponse:
      description: Resposta a uma requisição de criação ou atualização de subscription.
      required:
      - subscription
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/Subscription'
        operational_intent_references:
          description: >-
            Operational intents dentro ou perto da área da subscription no momento da criação ou atualização, se `notify_for_operational_intents` for verdadeiro.
          type: array
          items:
            $ref: '#/components/schemas/OperationalIntentReference'
          default: []
        constraint_references:
          description: >-
            Constraints dentro ou perto da área da subscription no momento da criação ou atualização, se `notify_for_constraints` for verdadeiro.
          type: array
          items:
            $ref: '#/components/schemas/ConstraintReference'
          default: []
    DeleteSubscriptionResponse:
      description: Resposta a uma remoção de subscription bem-sucedida.
      required:
      - subscription
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/Subscription'
    UssBaseURL:
      description: >-
        URL base da implementação, no SW-USS, de parte ou de toda a API entre SW-USS. A URL completa de um recurso é montada acrescentando, por exemplo, `/uss/v1/{resource}/{id}` a esta URL base. Por isso, ela não pode terminar com '/'. O host é um domínio, não um endereço IP, porque o `intended_audience` dos tokens para este SW-USS é esse domínio, sem a porta.
      type: string
      example: https://uss.empresa-a.com.br/utm
    OperationalIntentState:
      description: |
        Estado de uma operational intent.
        'Accepted': a operational intent foi criada e compartilhada, mas ainda não está em uso (detalhes na norma).
        A requisição de criação ou atualização desta operational intent reference deve incluir uma `key` com os OVNs de todas as entidades relevantes.
        'Activated': a operational intent está em uso (detalhes na norma).
        A requisição de criação ou atualização desta operational intent reference deve incluir uma `key` com os OVNs de todas as entidades relevantes.
        'Nonconforming': a UA está temporariamente fora dos seus volumes, mas espera-se que a situação seja recuperável (detalhes na norma).
        Neste estado, o endpoint `/uss/v1/operational_intents/{entityid}/telemetry` da API entre SW-USS deve responder, se disponível, às consultas dos demais SW-USS. A requisição de criação ou atualização pode omitir a `key`, porque a operational intent está sendo ajustada ao voo realizado e não necessariamente consegue ser desconflitada.
        'Contingent': considera-se que a UA não consegue mais, de forma irrecuperável, cumprir a sua operational intent (detalhes na norma).
        Neste estado, o endpoint `/uss/v1/operational_intents/{entityid}/telemetry` da API entre SW-USS deve responder, se disponível, às consultas dos demais SW-USS. A requisição de criação ou atualização pode omitir a `key`, porque a operational intent está sendo ajustada ao voo realizado e não necessariamente consegue ser desconflitada.
      type: string
      enum:
      - Accepted
      - Activated
      - Nonconforming
      - Contingent
    OperationalIntentReference:
      description: >-
        Informações gerais de uma operational intent planejada ou ativa, com a URL do SW-USS em que os detalhes podem ser consultados. Observação: o `ovn` só é devolvido ao SW-USS que criou a operational intent, NUNCA aos demais (para eles, o DSS do BR-UTM devolve o texto `Available from USS`).
      required:
      - id
      - manager
      - uss_availability
      - version
      - state
      - time_start
      - time_end
      - uss_base_url
      - subscription_id
      type: object
      properties:
        id:
          $ref: '#/components/schemas/EntityID'
        manager:
          type: string
          example: empresa-a
          description: >-
            Preenchido pelo DSS com o ID do cliente que criou a entidade (o `sub` do token de acesso). Usado pelo DSS para restringir alterações e remoções ao `manager`, e pelos SW-USS para rejeitar notificações de operational intent enviadas por um SW-USS que não a gerencia.
        uss_availability:
          $ref: '#/components/schemas/UssAvailabilityState'
        version:
          $ref: '#/components/schemas/EntityVersion'
        state:
          $ref: '#/components/schemas/OperationalIntentState'
        ovn:
          description: >-
            OVN desta operational intent. Só é preenchido quando a OperationalIntentReference é gerenciada pelo SW-USS que a consulta ou a fornece. Caso contrário, o SW-USS deve obter o OVN nos detalhes fornecidos pelo SW-USS que a gerencia.
          anyOf:
          - $ref: '#/components/schemas/EntityOVN'
        time_start:
          description: Início da operational intent.
          anyOf:
          - $ref: '#/components/schemas/Time'
        time_end:
          description: Fim da operational intent.
          anyOf:
          - $ref: '#/components/schemas/Time'
        uss_base_url:
          $ref: '#/components/schemas/OperationalIntentUssBaseURL'
        subscription_id:
          description: >-
            ID da subscription que garante que o `manager` da operational intent receba as atualizações relevantes do espaço aéreo.
          anyOf:
          - $ref: '#/components/schemas/SubscriptionID'
    OperationalIntentUssBaseURL:
      description: >-
        URL base da implementação, no SW-USS, das partes da API entre SW-USS necessárias para fornecer os detalhes desta operational intent e, se for o caso, a telemetria em não conformidade ou contingência.
      anyOf:
      - $ref: '#/components/schemas/UssBaseURL'
    PutOperationalIntentReferenceParameters:
      description: >-
        Parâmetros de uma requisição para criar uma OperationalIntentReference no DSS. Uma subscription para mudanças que se sobreponham a este volume pode ser criada implicitamente, mas isso pode ser substituído informando o `subscription_id` (opcional) a usar. Observação: a subscription implícita é gerenciada pelo DSS, não pelo SW-USS.
      required:
      - extents
      - state
      - uss_base_url
      type: object
      properties:
        extents:
          description: |
            Volumes espaço-temporais que delimitam esta operational intent.
            Início e fim, e altitudes mínima e máxima, são obrigatórios em cada volume. O fim não pode estar no passado. Todos os volumes, nominais e off-nominal, devem estar contidos nestes volumes, que não precisam coincidir com os volumes exatos da operational intent: um único volume envolvente basta, por exemplo.
          type: array
          items:
            $ref: '#/components/schemas/Volume4D'
          minItems: 1
        key:
          description: >-
            Prova de que o SW-USS que cria ou altera esta operational intent conhecia o estado atual do espaço aéreo e, portanto, de que a operational intent está desconflitada de todas as entidades relevantes. Não é obrigatória ao declarar a operational intent `Nonconforming` ou `Contingent`, nem quando não há entidades relevantes no espaço aéreo; nos demais casos, é obrigatória. OVNs de constraints são exigidos se, e somente se, o SW-USS que gerencia a operational intent exerce o papel de Constraint Processing, o que é indicado pela subscription associada à operational intent gerar notificações de constraints. A `key` não precisa conter o OVN da própria operational intent que está sendo alterada.
          anyOf:
          - $ref: '#/components/schemas/Key'
        state:
          $ref: '#/components/schemas/OperationalIntentState'
        uss_base_url:
          $ref: '#/components/schemas/OperationalIntentUssBaseURL'
        subscription_id:
          description: >-
            ID de uma subscription existente que o SW-USS usará para manter o operador informado sobre atualizações relevantes do espaço aéreo. Se este campo não for informado com a operational intent em `Activated`, `Nonconforming` ou `Contingent`, o campo `new_subscription` deve ser informado, para que a operational intent possa ser notificada. A subscription indicada deve cobrir pelo menos a área da operational intent e gerar notificações de operational intents.
          anyOf:
          - $ref: '#/components/schemas/EntityID'
        new_subscription:
          description: >-
            Se `subscription_id` não for informado e a operational intent estiver em `Activated`, `Nonconforming` ou `Contingent`, este campo deve ser preenchido. Quando preenchido, uma subscription implícita é criada e associada à operational intent, e em geral é removida automaticamente quando a operational intent é removida.
          anyOf:
          - $ref: '#/components/schemas/ImplicitSubscriptionParameters'
    ImplicitSubscriptionParameters:
      description: >-
        Informações necessárias para criar uma subscription que atenda às necessidades de notificação de uma única operational intent.
      type: object
      required:
      - uss_base_url
      properties:
        uss_base_url:
          description: >-
            URL base da implementação, no SW-USS, das partes da API entre SW-USS necessárias para receber as notificações de que a operational intent precisa. Isso inclui, no mínimo, notificações de mudanças relevantes em operational intents.
          anyOf:
          - $ref: '#/components/schemas/SubscriptionUssBaseURL'
        notify_for_constraints:
          description: >-
            Verdadeiro se a subscription desta operational intent deve gerar notificações quando constraints mudarem. Caso contrário, mudanças em constraints não geram notificações. É necessário o escopo `utm.constraint_processing` para ativar esta opção, e um SW-USS que exerce o papel de Constraint Processing deve ativá-la.
          type: boolean
          default: false
    GetOperationalIntentReferenceResponse:
      description: >-
        Resposta do DSS a uma requisição da OperationalIntentReference com o ID informado.
      required:
      - operational_intent_reference
      type: object
      properties:
        operational_intent_reference:
          $ref: '#/components/schemas/OperationalIntentReference'
    ChangeOperationalIntentReferenceResponse:
      description: >-
        Resposta a uma requisição de criação, atualização ou remoção de uma OperationalIntentReference no DSS.
      required:
      - subscribers
      - operational_intent_reference
      type: object
      properties:
        subscribers:
          description: >-
            Subscribers do DSS que este cliente agora tem a obrigação de notificar sobre as mudanças que acabou de fazer na operational intent. O cliente deve chamar POST em cada URL informada, conforme a API entre SW-USS `/uss/v1/operational_intents`. As subscriptions do próprio cliente também aparecem nesta lista.
          type: array
          items:
            $ref: '#/components/schemas/SubscriberToNotify'
          default: []
        operational_intent_reference:
          $ref: '#/components/schemas/OperationalIntentReference'
    QueryOperationalIntentReferenceParameters:
      description: >-
        Parâmetros de uma requisição para buscar OperationalIntentReferences que atendam aos critérios informados.
      type: object
      properties:
        area_of_interest:
          $ref: '#/components/schemas/Volume4D'
    QueryOperationalIntentReferenceResponse:
      description: >-
        Resposta do DSS a uma consulta de OperationalIntentReferences em uma área de interesse.
      required:
      - operational_intent_references
      type: object
      properties:
        operational_intent_references:
          description: OperationalIntentReferences na área de interesse.
          type: array
          items:
            $ref: '#/components/schemas/OperationalIntentReference'
          default: []
    ConstraintReference:
      description: >-
        Uma ConstraintReference (área em que existe uma constraint, com outras informações gerais, mas sem os detalhes). O DSS informa apenas estas referências; os clientes trocam os detalhes e as informações adicionais diretamente entre si (peer-to-peer).
      required:
      - id
      - manager
      - uss_availability
      - version
      - time_start
      - time_end
      - uss_base_url
      type: object
      properties:
        id:
          $ref: '#/components/schemas/EntityID'
        manager:
          type: string
          example: decea
          description: >-
            Preenchido pelo DSS com o ID do cliente que criou a entidade (o `sub` do token de acesso). Usado pelo DSS para restringir alterações e remoções ao `manager`, e pelos SW-USS para rejeitar notificações de constraint enviadas por um SW-USS que não a gerencia.
        uss_availability:
          $ref: '#/components/schemas/UssAvailabilityState'
        version:
          $ref: '#/components/schemas/EntityVersion'
        ovn:
          description: >-
            OVN desta constraint. Só é preenchido quando a ConstraintReference é gerenciada pelo SW-USS que a consulta ou a fornece. Caso contrário, o SW-USS deve obter o OVN nos detalhes fornecidos pelo SW-USS que a gerencia.
          anyOf:
          - $ref: '#/components/schemas/EntityOVN'
        time_start:
          $ref: '#/components/schemas/Time'
        time_end:
          $ref: '#/components/schemas/Time'
        uss_base_url:
          $ref: '#/components/schemas/ConstraintUssBaseURL'
    ConstraintUssBaseURL:
      description: >-
        URL base da implementação, no SW-USS, das partes da API entre SW-USS necessárias para fornecer os detalhes desta constraint.
      anyOf:
      - $ref: '#/components/schemas/UssBaseURL'
    PutConstraintReferenceParameters:
      description: >-
        Parâmetros de uma requisição para criar ou atualizar uma ConstraintReference no DSS.
      required:
      - extents
      - uss_base_url
      type: object
      properties:
        extents:
          description: |
            Volumes espaço-temporais que delimitam esta constraint.
            O fim não pode estar no passado.
            Todos os volumes da constraint devem estar contidos nestes volumes, que não precisam coincidir com os volumes exatos da constraint: um único volume envolvente basta, por exemplo.
          type: array
          items:
            $ref: '#/components/schemas/Volume4D'
          minItems: 1
        uss_base_url:
          $ref: '#/components/schemas/ConstraintUssBaseURL'
    GetConstraintReferenceResponse:
      description: >-
        Resposta do DSS a uma requisição da ConstraintReference com o ID informado.
      required:
      - constraint_reference
      type: object
      properties:
        constraint_reference:
          $ref: '#/components/schemas/ConstraintReference'
    ChangeConstraintReferenceResponse:
      description: >-
        Resposta a uma requisição de criação, atualização ou remoção de uma ConstraintReference no DSS.
      required:
      - subscribers
      - constraint_reference
      type: object
      properties:
        subscribers:
          description: >-
            Subscribers do DSS que este cliente agora tem a obrigação de notificar sobre as mudanças que acabou de fazer na constraint. O cliente deve chamar POST em cada URL informada, conforme a API entre SW-USS `/uss/v1/constraints`. As subscriptions do próprio cliente também aparecem nesta lista.
          type: array
          items:
            $ref: '#/components/schemas/SubscriberToNotify'
          default: []
        constraint_reference:
          $ref: '#/components/schemas/ConstraintReference'
    QueryConstraintReferenceParameters:
      description: >-
        Parâmetros de uma requisição para buscar ConstraintReferences que atendam aos critérios informados.
      type: object
      properties:
        area_of_interest:
          $ref: '#/components/schemas/Volume4D'
    QueryConstraintReferencesResponse:
      description: >-
        Resposta do DSS a uma consulta de ConstraintReferences em uma área de interesse.
      required:
      - constraint_references
      type: object
      properties:
        constraint_references:
          description: ConstraintReferences na área de interesse.
          type: array
          items:
            $ref: '#/components/schemas/ConstraintReference'
          default: []
    AirspaceConflictResponse:
      description: Dados devolvidos quando há um conflito no espaço aéreo.
      type: object
      properties:
        message:
          description: >-
            Mensagem legível que indica o erro e/ou o motivo.
          type: string
          example: Current OVNs not provided for one or more OperationalIntents or Constraints
        missing_operational_intents:
          description: >-
            Operational intent references para as quais não foi enviada prova atual de conhecimento. Se este campo vier preenchido, o SW-USS deve consultar a URL de detalhes de cada uma para obter os detalhes e o OVN correto, acrescentar os OVNs à `key` e repetir a chamada.
          type: array
          items:
            $ref: '#/components/schemas/OperationalIntentReference'
          default: []
        missing_constraints:
          description: >-
            Constraint references para as quais não foi enviada prova atual de conhecimento. Se este campo vier preenchido, o SW-USS deve consultar a URL de detalhes de cada uma para obter os detalhes e o OVN correto, acrescentar os OVNs à `key` e repetir a chamada.
          type: array
          items:
            $ref: '#/components/schemas/ConstraintReference'
          default: []
    UssAvailabilityStatus:
      type: object
      required:
      - uss
      - availability
      properties:
        uss:
          type: string
          description: >-
            ID do cliente (igual ao `sub` dos seus tokens de acesso) do SW-USS a que esta disponibilidade se refere.
          example: empresa-b
        availability:
          $ref: '#/components/schemas/UssAvailabilityState'
    UssAvailabilityState:
      type: string
      enum:
      - Unknown
      - Normal
      - Down
      description: |
        Um SW-USS é considerado `Unknown` até que um SW-USS com o escopo de arbitragem de disponibilidade indique outra coisa. Quando a arbitragem determina que um SW-USS não responde adequadamente, ele passa a `Down`.
        Um SW-USS em `Unknown` tem, no DSS, as mesmas capacidades de um SW-USS em `Normal`. No DSS do BR-UTM, um SW-USS `Down` também mantém essas capacidades: continua podendo criar, alterar e remover as próprias operational intents. O efeito de `Down` está descrito em `PUT /dss/v1/uss_availability/{uss_id}`.
    SetUssAvailabilityStatusParameters:
      type: object
      required:
      - old_version
      - availability
      properties:
        old_version:
          type: string
          default: ''
          description: >-
            Versão da disponibilidade do SW-USS a ser alterada, para leituras-alterações-escritas consistentes e novas tentativas consistentes.
        availability:
          $ref: '#/components/schemas/UssAvailabilityState'
    UssAvailabilityStatusResponse:
      type: object
      required:
      - status
      - version
      properties:
        version:
          type: string
          description: >-
            Versão atual da disponibilidade do SW-USS. Usada para alterar a disponibilidade.
          example: KGjtHT44V-BSZm1dbCD19AR9ssWXfzDgW5TsJVoz0TQ_
        status:
          $ref: '#/components/schemas/UssAvailabilityStatus'

    #
    # Data structures for logging
    #
    ExchangeRecord:
      type: object
      description: Detalhes de uma troca de requisição e resposta.
      required:
      - url
      - method
      - recorder_role
      - request_time
      - request_source
      properties:
        url:
          type: string
          description: URL completa da requisição.
          example: https://uss.empresa-b.com.br/utm/uss/v1/operational_intents
        method:
          type: string
          description: 'Verbo HTTP usado por quem fez a requisição (ex.: "PUT", "GET").'
          example: POST
        headers:
          description: >-
            Headers da requisição ou da resposta. Deve conter, no mínimo, o header `Authorization`.
          type: array
          items:
            type: string
          default: []
          example:
          - 'Authorization: Bearer <token>'
          - 'Content-Type: application/json'
        recorder_role:
          type: string
          description: >-
            Código que indica o papel do SW-USS que registrou a troca: 'Client' (fez a requisição a um SW-USS remoto) ou 'Server' (atendeu a requisição de um SW-USS remoto).
          enum:
          - Client
          - Server
        request_time:
          description: Momento em que a requisição foi enviada ou recebida.
          anyOf:
          - $ref: '#/components/schemas/Time'
        request_body:
          description: Corpo da requisição enviado ou recebido, codificado em Base64.
          type: string
          default: ''
        response_time:
          description: Momento em que a resposta foi enviada ou recebida.
          anyOf:
          - $ref: '#/components/schemas/Time'
        response_body:
          type: string
          default: ''
          description: >-
            Corpo da resposta enviado ou recebido, codificado em Base64.
        response_code:
          type: integer
          format: int32
          default: 0
          description: Código HTTP da resposta enviada ou recebida.
        problem:
          type: string
          description: >-
            Descrição legível do problema da troca, se houver.
          example: Sem resposta em 10 segundos
    ErrorReport:
      type: object
      description: Relato que informa um servidor sobre um problema de comunicação.
      required:
      - exchange
      properties:
        report_id:
          type: string
          maxLength: 128
          description: >-
            ID atribuído pelo servidor que recebe o relato. Não preencha ao enviar um relato.
          example: e9b1c3d5-7f2a-4b6c-8d0e-2a4c6e8f0b1d
        exchange:
          anyOf:
          - $ref: '#/components/schemas/ExchangeRecord'
          description: >-
            Requisição (feita por este SW-USS) e resposta associadas ao erro.
    RidCircle:
      description: Área circular na superfície da Terra.
      type: object
      properties:
        center:
          $ref: '#/components/schemas/RidLatLngPoint'
        radius:
          $ref: '#/components/schemas/Radius'
    RidVolume3D:
      description: >-
        Volume geográfico tridimensional formado pela extrusão vertical de uma forma. Deve ser informado exatamente um contorno.
      type: object
      properties:
        outline_circle:
          anyOf:
          - $ref: '#/components/schemas/RidCircle'
          description: Forma geográfica circular na superfície da Terra.
        outline_polygon:
          anyOf:
          - $ref: '#/components/schemas/RidPolygon'
          description: >-
            Forma geográfica poligonal na superfície da Terra.
        altitude_lower:
          description: >-
            Altitude mínima do volume. Se informada, deve ser menor que `altitude_upper`.
          anyOf:
          - $ref: '#/components/schemas/RidAltitude'
        altitude_upper:
          description: >-
            Altitude máxima do volume. Se informada, deve ser maior que `altitude_lower`.
          anyOf:
          - $ref: '#/components/schemas/RidAltitude'
    RidVolume4D:
      description: Bloco contínuo de espaço-tempo geográfico.
      required:
      - volume
      type: object
      properties:
        volume:
          $ref: '#/components/schemas/RidVolume3D'
        time_start:
          description: Início do volume. Deve ser anterior a `time_end`.
          anyOf:
          - $ref: '#/components/schemas/Time'
        time_end:
          description: Fim do volume. Deve ser posterior a `time_start`.
          anyOf:
          - $ref: '#/components/schemas/Time'
    RidGetSubscriptionResponse:
      description: Resposta do DSS a uma requisição da subscription com o ID informado.
      required:
      - subscription
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/RidSubscription'
    SearchSubscriptionsResponse:
      description: Resposta do DSS a uma consulta de subscriptions em uma área.
      type: object
      properties:
        subscriptions:
          description: Subscriptions que se sobrepõem à área informada.
          type: array
          items:
            $ref: '#/components/schemas/RidSubscription'
          default: []
    URL:
      description: URL http ou https válida.
      type: string
      example: https://uss.empresa-b.com.br/rid
    RidSubscriptionNotificationIndex:
      format: int32
      description: Contador das notificações enviadas para uma subscription, para que o subscriber perceba com mais facilidade notificações perdidas.
      type: integer
      example: 3
    RidSubscriptionState:
      description: Estado da subscription que motivou o envio de uma notificação.
      required:
      - subscription_id
      type: object
      properties:
        subscription_id:
          $ref: '#/components/schemas/SubscriptionUUID'
        notification_index:
          anyOf:
          - $ref: '#/components/schemas/RidSubscriptionNotificationIndex'
          default: 0
    UUIDv4:
      description: UUID versão 4.
      maxLength: 36
      minLength: 36
      type: string
      example: 03e5572a-f733-49af-bc14-8a18bd53ee39
    Version:
      description: 'A `version` é um texto opaco gerado pelo DSS, que muda a cada gravação (hoje, o instante da gravação em nanossegundos, escrito em base 32, ex.: `1hp9apg58umv8`). Envie exatamente o valor recebido, sem interpretá-lo. Toda atualização ou remoção deve informar a versão atual, para que as alterações sejam idempotentes.'
      type: string
      example: 1hp9apg58umv8
    EntityUUID:
      anyOf:
      - $ref: '#/components/schemas/UUIDv4'
      description: Identificador universalmente único de uma entidade comunicada pelo DSS, no formato UUIDv4.
    SubscriptionUUID:
      anyOf:
      - $ref: '#/components/schemas/UUIDv4'
      description: Identificador universalmente único de uma subscription comunicada pelo DSS, no formato UUIDv4.
    RidErrorResponse:
      description: Dados devolvidos quando ocorre uma condição fora do normal.
      type: object
      properties:
        message:
          description: Mensagem legível que indica o erro e/ou o motivo.
          type: string
          default: ''
          example: IdentificationServiceArea time_end must be after time_start
    RidDeleteSubscriptionResponse:
      description: Resposta a uma remoção de subscription bem-sucedida.
      required:
      - subscription
      type: object
      properties:
        subscription:
          anyOf:
          - $ref: '#/components/schemas/RidSubscription'
          description: A subscription removida.
    GeoPolygonString:
      description: |
        Representação em texto simples de um polígono geográfico com pelo menos três pontos, que descrevem um polígono fechado sobre a Terra. Cada ponto é latitude,longitude em graus, e os pontos também são separados por vírgula, então o parâmetro tem a forma `lat1,lng1,lat2,lng2,lat3,lng3,...`. Latitudes devem estar no intervalo [-90, 90] e longitudes no intervalo [-180, 180].

        Não repita o primeiro ponto no fim: o DSS fecha o polígono sozinho e rejeita (`400`) uma área cujo último ponto repete o primeiro.

        Todos os requisitos e esclarecimentos de Polygon valem também para GeoPolygonString.
      type: string
      example: -23.55,-46.64,-23.55,-46.63,-23.54,-46.63,-23.54,-46.64
    RidLatitude:
      format: double
      description: Graus de latitude ao norte do equador, em relação ao elipsoide WGS84. Inválido, sem valor ou desconhecido é 0 grau (em latitude e longitude).
      maximum: 90
      exclusiveMaximum: false
      minimum: -90
      exclusiveMinimum: false
      type: number
      example: -23.5505
      default: 0
    RidLongitude:
      format: double
      description: Graus de longitude a leste do meridiano de Greenwich, em relação ao elipsoide WGS84. Inválido, sem valor ou desconhecido é 0 grau (em latitude e longitude).
      maximum: 180
      exclusiveMaximum: false
      minimum: -180
      exclusiveMinimum: false
      type: number
      example: -46.6333
      default: 0
    RidLatLngPoint:
      description: Ponto na superfície da Terra.
      required:
      - lat
      - lng
      type: object
      properties:
        lng:
          $ref: '#/components/schemas/RidLongitude'
        lat:
          $ref: '#/components/schemas/RidLatitude'
    RidAltitude:
      type: object
      required:
      - value
      - reference
      - units
      properties:
        value:
          description: >-
            Valor numérico da altitude. Os valores mínimo e máximo servem como verificação de sanidade e podem ser revistos à medida que novas unidades ou referenciais forem permitidos. Inválido, sem valor ou desconhecido é –1000 m.
          type: number
          format: double
          minimum: -8000
          exclusiveMinimum: false
          maximum: 100000
          exclusiveMaximum: false
          example: 120
        reference:
          description: >-
            Código do referencial da distância vertical. Ver AIXM 5.1 e FIXM 4.2.0. Hoje o UTM só aceita WGS84, sem planos imediatos de aceitar outros. FIXM e AIXM aceitam 'SFC', equivalente a AGL.
          type: string
          enum:
          - W84
        units:
          description: >-
            Unidade usada para expressar a altitude. Ver FIXM 4.2. Hoje o UTM só aceita metros, sem planos imediatos de aceitar outras.
          type: string
          enum:
          - M
    RidPolygon:
      description: >-
        Área fechada sobre a Terra. As arestas do polígono são os caminhos mais curtos entre vértices consecutivos. Isso significa, por exemplo, que a aresta entre dois pontos de mesma latitude em geral não fica sobre essa latitude. A ordem dos vértices deve ser interpretada como a que produz a menor área. As arestas não podem se cruzar e os vértices não podem se repetir; em particular, o último vértice não pode ser igual ao primeiro.
      required:
      - vertices
      type: object
      properties:
        vertices:
          minItems: 3
          type: array
          items:
            $ref: '#/components/schemas/RidLatLngPoint'
    PutIdentificationServiceAreaResponse:
      description: Resposta a uma requisição de criação ou atualização da referência de uma Identification Service Area no DSS.
      required:
      - service_area
      type: object
      properties:
        subscribers:
          description: Subscribers do DSS que este cliente agora tem a obrigação de notificar sobre as mudanças que acabou de fazer na Identification Service Area. O cliente deve chamar POST em cada URL informada, conforme a API `/uss/identification_service_areas/{id}`.
          type: array
          items:
            $ref: '#/components/schemas/RidSubscriberToNotify'
          default: []
        service_area:
          anyOf:
          - $ref: '#/components/schemas/IdentificationServiceArea'
          description: Área de serviço resultante, gravada no DSS.
    SearchIdentificationServiceAreasResponse:
      description: Resposta do DSS a uma consulta de Identification Service Areas em uma área de interesse.
      type: object
      properties:
        service_areas:
          description: Identification Service Areas na área de interesse.
          type: array
          items:
            $ref: '#/components/schemas/IdentificationServiceArea'
          default: []
    RidSubscriberToNotify:
      description: Subscriber que deve ser notificado da criação, alteração ou remoção de algo no espaço aéreo. O DSS informa os subscribers ao cliente que alterou o espaço aéreo, e cabe a esse cliente (que recebe um conjunto destes pedidos) enviar uma notificação a cada `url` indicada.
      required:
      - subscriptions
      - url
      type: object
      properties:
        subscriptions:
          description: Subscription(s) que motivaram esta notificação.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RidSubscriptionState'
        url:
          anyOf:
          - $ref: '#/components/schemas/URL'
          description: Endpoint a que o cliente que alterou o espaço aéreo deve enviar a atualização. A API depende da ação no DSS que gerou este pedido de notificação.
    DeleteIdentificationServiceAreaResponse:
      description: Resposta a uma requisição de remoção de Identification Service Area.
      required:
      - service_area
      type: object
      properties:
        service_area:
          anyOf:
          - $ref: '#/components/schemas/IdentificationServiceArea'
          description: Identification Service Area que acabou de ser removida.
        subscribers:
          description: Subscribers do DSS que este cliente agora tem a obrigação de notificar sobre a Identification Service Area que acabou de remover. O cliente deve chamar POST em cada URL informada, conforme a API `/uss/identification_service_areas`.
          type: array
          items:
            $ref: '#/components/schemas/RidSubscriberToNotify'
          default: []
    RidPutSubscriptionResponse:
      description: Resposta a uma requisição de criação ou atualização de subscription.
      required:
      - subscription
      type: object
      properties:
        service_areas:
          description: Identification Service Areas dentro ou perto da área da subscription no momento da criação ou atualização, se o callback `identification_service_area_url` tiver sido informado.
          type: array
          items:
            $ref: '#/components/schemas/IdentificationServiceArea'
          default: []
        subscription:
          anyOf:
          - $ref: '#/components/schemas/RidSubscription'
          description: Resultado da operação na subscription.
    GetIdentificationServiceAreaResponse:
      description: Resposta do DSS a uma requisição da Identification Service Area com o ID informado.
      required:
      - service_area
      type: object
      properties:
        service_area:
          $ref: '#/components/schemas/IdentificationServiceArea'
    CreateIdentificationServiceAreaParameters:
      description: Parâmetros de uma requisição para criar uma Identification Service Area no DSS.
      required:
      - extents
      - uss_base_url
      type: object
      properties:
        extents:
          anyOf:
          - $ref: '#/components/schemas/RidVolume4D'
          description: |
            Volumes espaço-temporais que delimitam esta Identification Service Area. O fim é obrigatório. Se o início não for informado, vale o momento atual. O DSS deve rejeitar inícios no passado, mas pode ajustar inícios muito recentes para o momento atual.

            Estes volumes não devem revelar informações sensíveis sobre os voos que contêm. Isso significa, por exemplo, que não devem envolver justo a trajetória de um voo nem, em geral, ficar centrados no ponto de decolagem de um único voo.
        uss_base_url:
          $ref: '#/components/schemas/FlightsUSSBaseURL'
    UpdateIdentificationServiceAreaParameters:
      description: Parâmetros de uma requisição para atualizar uma Identification Service Area no DSS.
      required:
      - extents
      - uss_base_url
      type: object
      properties:
        extents:
          anyOf:
          - $ref: '#/components/schemas/RidVolume4D'
          description: |
            Volumes espaço-temporais que delimitam esta Identification Service Area. O fim é obrigatório. Se o início não for informado, ele não muda. O DSS deve rejeitar inícios no passado, a menos que sejam iguais ao início atual da Identification Service Area.

            Estes volumes não devem revelar informações sensíveis sobre os voos que contêm. Isso significa, por exemplo, que não devem envolver justo a trajetória de um voo nem, em geral, ficar centrados no ponto de decolagem de um único voo.
        uss_base_url:
          $ref: '#/components/schemas/FlightsUSSBaseURL'
    CreateSubscriptionParameters:
      description: Parâmetros de uma requisição para criar uma subscription no DSS.
      required:
      - extents
      - uss_base_url
      type: object
      properties:
        extents:
          anyOf:
          - $ref: '#/components/schemas/RidVolume4D'
          description: |
            Volumes espaço-temporais da área de interesse.

            A subscription é removida automaticamente depois do seu fim, se não for renovada antes. Se o fim não for informado, o DSS escolhe o valor.

            Algumas entidades que geram notificações podem estar inteiramente fora da área pedida.
        uss_base_url:
          $ref: '#/components/schemas/SubscriptionUSSBaseURL'
    UpdateSubscriptionParameters:
      description: Parâmetros de uma requisição para atualizar uma subscription no DSS.
      required:
      - extents
      - uss_base_url
      type: object
      properties:
        extents:
          anyOf:
          - $ref: '#/components/schemas/RidVolume4D'
          description: |
            Volumes espaço-temporais da área de interesse.

            A subscription é removida automaticamente depois do seu fim, se não for renovada antes. Se o fim não for informado, o DSS escolhe o valor.

            Algumas entidades que geram notificações podem estar inteiramente fora da área pedida.
        uss_base_url:
          $ref: '#/components/schemas/SubscriptionUSSBaseURL'
    RidSubscription:
      description: Área geográfica pela qual um cliente tem interesse contínuo (por exemplo, uma "área de planejamento"). Interna ao DSS.
      required:
      - id
      - uss_base_url
      - owner
      - version
      type: object
      properties:
        id:
          anyOf:
          - $ref: '#/components/schemas/SubscriptionUUID'
          description: Identificador único desta subscription.
        uss_base_url:
          $ref: '#/components/schemas/SubscriptionUSSBaseURL'
        owner:
          description: Atribuído pelo DSS com o ID do cliente que a criou (via token de acesso). Usado para restringir alterações e remoções ao `owner`.
          type: string
          example: empresa-a
        notification_index:
          anyOf:
          - $ref: '#/components/schemas/RidSubscriptionNotificationIndex'
          default: 0
        time_end:
          description: Se informado, a subscription é removida automaticamente depois deste instante.
          anyOf:
          - $ref: '#/components/schemas/Time'
        time_start:
          description: Se informado, a subscription não gera notificações antes deste instante.
          anyOf:
          - $ref: '#/components/schemas/Time'
        version:
          $ref: '#/components/schemas/Version'
    IdentificationServiceArea:
      description: 'Uma Identification Service Area (área em que um SW-USS presta serviço de Remote ID). O DSS guarda e devolve apenas esta referência: `id`, `owner`, `uss_base_url`, intervalo de tempo e `version`. A área não é devolvida, e os clientes trocam as informações dos voos diretamente entre si (peer-to-peer).'
      required:
      - uss_base_url
      - owner
      - time_start
      - time_end
      - version
      - id
      type: object
      properties:
        uss_base_url:
          $ref: '#/components/schemas/FlightsUSSBaseURL'
        owner:
          description: Atribuído pelo DSS com o ID do cliente que a criou (via token de acesso). Usado para restringir alterações e remoções ao `owner`.
          type: string
          example: empresa-a
        time_start:
          description: Início do serviço.
          anyOf:
          - $ref: '#/components/schemas/Time'
        time_end:
          description: Fim do serviço.
          anyOf:
          - $ref: '#/components/schemas/Time'
        version:
          $ref: '#/components/schemas/Version'
        id:
          anyOf:
          - $ref: '#/components/schemas/EntityUUID'
          description: Identificador único desta Identification Service Area.
    USSBaseURL:
      description: |-
        URL base da implementação, no SW-USS, de parte ou de toda a API de Remote ID entre SW-USS. A URL completa de um recurso é montada acrescentando, por exemplo, `/uss/{resource}/{id}` a esta URL base. Por isso, ela não pode terminar com '/'. O host é um domínio, não um endereço IP, porque o `intended_audience` dos tokens para este SW-USS é esse domínio, sem a porta.
      type: string
      example: https://uss.empresa-a.com.br/rid
    SubscriptionUSSBaseURL:
      description: URL base da implementação da API de SW-USS, incluindo o endpoint `POST identification_service_areas`, em que as notificações desta subscription serão recebidas.
      anyOf:
      - $ref: '#/components/schemas/USSBaseURL'
    FlightsUSSBaseURL:
      description: URL base da implementação da API de SW-USS, incluindo os endpoints `GET flights` e `GET flights/{id}/details`, em que as informações de voo podem ser obtidas.
      anyOf:
      - $ref: '#/components/schemas/USSBaseURL'
