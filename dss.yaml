  description: >-
    Endpoints do DSS para referências de constraints.
- name: Subscriptions
  description: >-
    Endpoints do DSS para subscriptions do UTM.
- name: Reports
  description: Endpoint do DSS para relatar problemas de comunicação.
- name: Availability
  description: Endpoints do DSS para declarar a disponibilidade de um SW-USS.
