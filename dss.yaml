  #
  # DSS endpoints for USS availability
  #
  /dss/v1/uss_availability/{uss_id}:
    summary: Estado de disponibilidade de um SW-USS.
    parameters:
    - name: uss_id
      description: >-
        ID do cliente (igual ao `sub` dos seus tokens de acesso) do SW-USS a que esta disponibilidade se refere.
      schema:
        type: string
      in: path
      required: true
      example: empresa-b
    put:
      security:
      - Authority:
        - utm.availability_arbitration
      summary: Define a disponibilidade de um SW-USS
      operationId: setUssAvailability
      description: |
        **Escopo:** `utm.availability_arbitration`

        Define o estado de disponibilidade (`Unknown`, `Normal` ou `Down`) de um SW-USS.

        **O que `Down` muda no DSS do BR-UTM:** as operational intents do SW-USS `Down` que estão em `Accepted` deixam de ser exigidas na `key` de quem cria ou altera operational intents na mesma área. É só isso:

        - as operational intents do SW-USS `Down` não são removidas nem invalidadas e continuam aparecendo nas consultas, com `uss_availability: Down`;
        - as que estão em `Activated`, `Nonconforming` ou `Contingent` continuam exigidas na `key`;
        - o SW-USS `Down` continua podendo criar, alterar e remover as próprias operational intents: o DSS do BR-UTM não bloqueia as operações de um SW-USS `Down`.

        **Quem pode chamar:** qualquer cliente com o escopo `utm.availability_arbitration`, para qualquer `uss_id`. O DSS não restringe `uss_id` ao `sub` do token: quem tem esse escopo pode declarar qualquer SW-USS indisponível. O escopo serve para arbitrar a disponibilidade com base em evidência de que um SW-USS não responde, ou para um SW-USS declarar o próprio estado (por exemplo, `Down` antes de uma parada e `Normal` na volta). **Não o use para tornar outro SW-USS indisponível com o objetivo de ignorar as operações dele:** isso compromete a desconflitação de todos os participantes.

        Envie em `old_version` a versão atual, obtida no `GET` (vazia se a disponibilidade nunca foi definida). O DSS do BR-UTM hoje não confere esse valor.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUssAvailabilityStatusParameters'
            examples:
              down:
                summary: Declara um SW-USS indisponível
                value:
                  old_version: KGjtHT44V-BSZm1dbCD19AR9ssWXfzDgW5TsJVoz0TQ_
                  availability: Down
        required: true
      tags:
      - Availability
      responses:
        '200':
          description: >-
            O estado de disponibilidade do SW-USS foi atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UssAvailabilityStatusResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: '* Um ou mais parâmetros estão ausentes ou inválidos.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            * O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint ou à requisição.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O cliente fez requisições demais em pouco tempo.
    get:
      security:
      - Authority:
        - utm.availability_arbitration
      - Authority:
        - utm.strategic_coordination
      - Authority:
        - utm.conformance_monitoring_sa
      summary: Obtém a disponibilidade de um SW-USS
      operationId: getUssAvailability
      description: |
        **Escopos aceitos** (qualquer uma das opções): `utm.availability_arbitration` ou `utm.strategic_coordination` ou `utm.conformance_monitoring_sa`

        Devolve o estado de disponibilidade (`Unknown`, `Normal` ou `Down`) e a versão atual da disponibilidade do SW-USS cujo `sub` é `uss_id`. Um SW-USS cuja disponibilidade nunca foi definida aparece como `Unknown`, com `version` vazia.

        O efeito de cada estado no DSS está descrito em `PUT /dss/v1/uss_availability/{uss_id}`.
      tags:
      - Availability
      responses:
        '200':
          description: >-
            O estado de disponibilidade do SW-USS foi obtido com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UssAvailabilityStatusResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: '* Um ou mais parâmetros estão ausentes ou inválidos.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            * O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint ou à requisição.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O cliente fez requisições demais em pouco tempo.

  #
  # USS endpoints for operational intents
  #
  /rid/v2/dss/identification_service_areas:
    summary: Conjunto de Identification Service Areas no DSS.
    description: ''
    get:
      tags:
      - Identification Service Areas (Remote ID)
      operationId: searchIdentificationServiceAreas
      parameters:
      - name: area
        description: 'Área em que as Identification Service Areas serão buscadas. Algumas ISAs próximas, mas totalmente fora desta área, também podem ser devolvidas. Não repita o primeiro ponto no fim: o DSS fecha o polígono sozinho e rejeita (`400`) uma área cujo último ponto repete o primeiro.'
        schema:
          $ref: '#/components/schemas/GeoPolygonString'
        in: query
        required: true
        example: -23.55,-46.64,-23.55,-46.63,-23.54,-46.63,-23.54,-46.64
      - name: earliest_time
        description: Se informado, indica que não há interesse em ISAs que terminam antes deste instante. Formato RFC 3339, conforme a especificação OpenAPI. O fuso horário deve ser 'Z'.
        schema:
          format: date-time
          type: string
        in: query
        required: true
        example: '2026-11-05T14:00:00Z'
      - name: latest_time
        description: Se informado, indica que não há interesse em ISAs que começam depois deste instante. Formato RFC 3339, conforme a especificação OpenAPI. O fuso horário deve ser 'Z'.
        schema:
          format: date-time
          type: string
        in: query
        required: true
        example: '2026-11-05T16:00:00Z'
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchIdentificationServiceAreasResponse'
          description: As Identification Service Areas foram obtidas com sucesso.
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: Um ou mais parâmetros de entrada estão ausentes ou inválidos.
        401:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        403:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint.
        413:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: A área solicitada é grande demais.
      security:
      - Authority:
        - rid.display_provider
      summary: Busca as ISAs de uma área
      description: |
        **Escopo:** `rid.display_provider`

        Devolve as Identification Service Areas que se sobrepõem a `area`, com filtro opcional por `earliest_time` e `latest_time`. Algumas ISAs devolvidas podem estar inteiramente fora da área pedida.

        `area` é a lista de vértices do polígono em texto: `lat1,lng1,lat2,lng2,...`, sem repetir o primeiro ponto no fim. O DSS fecha o polígono sozinho e rejeita (`400`) uma área cujo último ponto repete o primeiro. Exemplo de um quadrado: `-23.55,-46.64,-23.55,-46.63,-23.54,-46.63,-23.54,-46.64`.

        Cada ISA devolvida é só uma referência (veja `GET /rid/v2/dss/identification_service_areas/{id}`). Usada por quem consome telemetria (Display Provider): para cada ISA, consulte os voos no SW-USS indicado em `uss_base_url` (`GET /uss/flights`).
  /rid/v2/dss/identification_service_areas/{id}:
    summary: Uma Identification Service Area no DSS.
    parameters:
    - name: id
      description: EntityUUID da Identification Service Area.
      schema:
        $ref: '#/components/schemas/EntityUUID'
      in: path
      required: true
    get:
      tags:
      - Identification Service Areas (Remote ID)
      operationId: getIdentificationServiceArea
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIdentificationServiceAreaResponse'
              examples:
                isa:
                  summary: 'A ISA é só uma referência: sem área e sem dados de voo'
                  value:
                    service_area: &id004
                      uss_base_url: https://uss.empresa-a.com.br/rid
                      owner: empresa-a
                      time_start: &id007
                        value: '2026-11-05T13:58:00Z'
                        format: RFC3339
                      time_end:
                        value: '2026-11-05T14:40:00Z'
                        format: RFC3339
                      version: 1hp9apg58umv8
                      id: 5e1f3a7c-9b2d-4c6e-8f0a-1d3b5c7e9f2a
          description: A ISA foi obtida com sucesso.
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: Um ou mais parâmetros de entrada estão ausentes ou inválidos.
        401:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        403:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint.
        404:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: A entidade solicitada não foi encontrada.
      security:
      - Authority:
        - rid.display_provider
      summary: Obtém uma ISA
      description: |
        **Escopo:** `rid.display_provider`

        Devolve a ISA como o DSS a guarda, que é só uma referência: `id`, `owner`, `uss_base_url`, `time_start`, `time_end` e `version`. A área da ISA não é devolvida (o DSS guarda só as células S2 que a cobrem), e os dados dos voos ficam no SW-USS indicado em `uss_base_url` (`GET /uss/flights`).
    put:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIdentificationServiceAreaParameters'
            examples:
              isa:
                summary: ISA criada na ativação, com folga em volta do voo
                value:
                  extents:
                    volume: &id005
                      outline_polygon:
                        vertices:
                        - lat: -23.56
                          lng: -46.65
                        - lat: -23.56
                          lng: -46.62
                        - lat: -23.53
                          lng: -46.62
                        - lat: -23.53
                          lng: -46.65
                      altitude_lower:
                        value: 0
                        reference: W84
                        units: M
                      altitude_upper:
                        value: 150
                        reference: W84
                        units: M
                    time_start: &id006
                      value: '2026-11-05T13:58:00Z'
                      format: RFC3339
                    time_end:
                      value: '2026-11-05T14:40:00Z'
                      format: RFC3339
                  uss_base_url: https://uss.empresa-a.com.br/rid
        required: true
      tags:
      - Identification Service Areas (Remote ID)
      operationId: createIdentificationServiceArea
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutIdentificationServiceAreaResponse'
              examples:
                criada:
                  summary: ISA criada; guarde a version e notifique o subscriber
                  value:
                    service_area: *id004
                    subscribers:
                    - url: https://uss.empresa-b.com.br/rid
                      subscriptions:
                      - subscription_id: 4d7e9a1c-2b3f-4a5d-8e6c-7f9b1d3a5c8e
                        notification_index: 3
          description: A Identification Service Area foi criada com sucesso no DSS.
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: |
            * Um ou mais parâmetros de entrada estão ausentes ou inválidos.
            * A requisição tentou alterar a Identification Service Area de uma forma não permitida.
        401:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        403:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint.
        409:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: |
            * Já existe uma Identification Service Area com o ID informado, de outro cliente.
            * Apesar de várias tentativas, o DSS não conseguiu atualizar os dados por causa de outras alterações simultâneas.
        413:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: A área da Identification Service Area é grande demais.
      security:
      - Authority:
        - rid.service_provider
      summary: Cria uma ISA
      description: |
        **Escopo:** `rid.service_provider`

        Declara que o seu SW-USS passa a servir telemetria Remote ID em uma área. No BR-UTM, a ISA é criada quando a operational intent é ativada, isto é, quando o SW-USS começa a compartilhar telemetria.

        - O `id` é um UUIDv4 gerado pelo seu SW-USS. A criação falha se já existir uma ISA com o mesmo ID.
        - Guarde a `version` devolvida em `service_area.version`: ela é necessária para atualizar ou remover a ISA.
        - `time_end` é obrigatório. Sem `time_start`, vale o momento atual; um `time_start` mais de 5 minutos no passado é rejeitado.
        - O BR-UTM não define período de retenção da ISA: `time_end` pode ser o fim do voo.
        - Notifique os SW-USS listados em `subscribers` com `POST /uss/identification_service_areas/{id}`.
  /rid/v2/dss/identification_service_areas/{id}/{version}:
    summary: Uma versão específica de uma Identification Service Area no DSS.
    parameters:
    - name: id
      description: EntityUUID da Identification Service Area.
      schema:
        $ref: '#/components/schemas/EntityUUID'
      in: path
      required: true
    - name: version
      description: 'Versão atual, como o DSS a devolveu no campo `version` (na criação, na última atualização ou num `GET`). A `version` é um texto opaco gerado pelo DSS, que muda a cada gravação (hoje, o instante da gravação em nanossegundos, escrito em base 32, ex.: `1hp9apg58umv8`). Envie exatamente o valor recebido, sem interpretá-lo.'
      schema:
        type: string
      in: path
      required: true
      example: 1hp9apg58umv8
    put:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIdentificationServiceAreaParameters'
            examples:
              estender:
                summary: Estende o fim da ISA em 20 minutos
                value:
                  extents:
                    volume: *id005
                    time_start: *id006
                    time_end:
                      value: '2026-11-05T15:00:00Z'
                      format: RFC3339
                  uss_base_url: https://uss.empresa-a.com.br/rid
        required: true
      tags:
      - Identification Service Areas (Remote ID)
      operationId: updateIdentificationServiceArea
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutIdentificationServiceAreaResponse'
              examples:
                atualizada:
                  summary: ISA atualizada, com nova version
                  value:
                    service_area:
                      uss_base_url: https://uss.empresa-a.com.br/rid
                      owner: empresa-a
                      time_start: *id007
                      time_end:
                        value: '2026-11-05T15:00:00Z'
                        format: RFC3339
                      version: 1hp9bj1i0as00
                      id: 5e1f3a7c-9b2d-4c6e-8f0a-1d3b5c7e9f2a
                    subscribers: []
          description: A Identification Service Area foi atualizada com sucesso no DSS.
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: |
            * Um ou mais parâmetros de entrada estão ausentes ou inválidos.
            * A requisição tentou alterar a Identification Service Area de uma forma não permitida.
        401:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        403:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint.
        409:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: |
            * A versão atual da Identification Service Area não corresponde à versão enviada.
            * Apesar de várias tentativas, o DSS não conseguiu atualizar os dados por causa de outras alterações simultâneas.
        413:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: A área da Identification Service Area é grande demais.
      security:
      - Authority:
        - rid.service_provider
      summary: Atualiza uma ISA
      description: |
        **Escopo:** `rid.service_provider`

        Substitui a ISA pela nova versão (só a mais recente é guardada); só o dono pode alterar.

        - Envie no caminho a `version` atual da ISA, a devolvida em `service_area.version` na criação, na última atualização ou num `GET`. Se ela não for a atual (outra atualização aconteceu no meio), o DSS responde `409`: faça um `GET`, pegue a `version` atual e repita.
        - A `version` é um texto opaco gerado pelo DSS, que muda a cada gravação (hoje, o instante da gravação em nanossegundos, escrito em base 32, ex.: `1hp9apg58umv8`). Envie exatamente o valor recebido, sem interpretá-lo.
        - Depois de atualizar, use a nova `version` da resposta.
        - Sem `time_start`, o início não muda; sem `time_end`, o fim não muda. Não é permitido mudar `time_start` para antes do momento atual.
        - O BR-UTM não define período de retenção da ISA: `time_end` pode ser o fim do voo.
        - Notifique os SW-USS listados em `subscribers` com `POST /uss/identification_service_areas/{id}`.
    delete:
      tags:
      - Identification Service Areas (Remote ID)
      operationId: deleteIdentificationServiceArea
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteIdentificationServiceAreaResponse'
          description: A Identification Service Area foi removida do DSS com sucesso.
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: Um ou mais parâmetros de entrada estão ausentes ou inválidos.
        401:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        403:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: |
            * O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint.
            * A Identification Service Area não pertence ao cliente que pediu a remoção.
        404:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: A entidade não pôde ser removida porque não foi encontrada.
        409:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: |
            * A versão atual da Identification Service Area não corresponde à versão enviada.
            * Apesar de várias tentativas, o DSS não conseguiu atualizar os dados por causa de outras alterações simultâneas.
      security:
      - Authority:
        - rid.service_provider
      summary: Remove uma ISA
      description: |
        **Escopo:** `rid.service_provider`

        Remove a Identification Service Area; só o dono pode remover. Envie no caminho a `version` atual, a devolvida em `service_area.version` na criação, na última atualização ou num `GET` (`409` se não for a atual). Não há período de retenção da ISA: ela pode ser removida logo ao fim do voo.

        Notifique os SW-USS listados em `subscribers` com `POST /uss/identification_service_areas/{id}`.
  /rid/v2/dss/subscriptions:
    summary: Subscriptions para receber atualizações do espaço aéreo em um volume de interesse.
    get:
      tags:
      - Subscriptions (Remote ID)
      operationId: searchSubscriptions
      parameters:
      - name: area
        description: 'Área em que as subscriptions serão buscadas. Algumas subscriptions próximas, mas totalmente fora desta área, também podem ser devolvidas. Não repita o primeiro ponto no fim: o DSS fecha o polígono sozinho e rejeita (`400`) uma área cujo último ponto repete o primeiro.'
        schema:
          $ref: '#/components/schemas/GeoPolygonString'
        in: query
        required: true
        example: -23.55,-46.64,-23.55,-46.63,-23.54,-46.63,-23.54,-46.64
      responses:
        200:
          content:
            application/json:
