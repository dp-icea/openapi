          description: A subscription foi criada com sucesso.
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: |
            * Um ou mais parâmetros de entrada estão ausentes ou inválidos.
            * A requisição tentou alterar a subscription de uma forma não permitida.
        401:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        403:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: |-
            * O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint ou à requisição.
        409:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: |
            * Já existe uma subscription com o ID informado, de outro cliente.
            * Apesar de várias tentativas, o DSS não conseguiu atualizar os dados por causa de outras alterações simultâneas.
        429:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: |
            O cliente já tem subscriptions demais na área em que pediu uma nova. Para corrigir, consulte `GET /rid/v2/dss/subscriptions` e veja quais subscriptions contam para o limite. Em geral isso não acontece, porque o limite fica acima do que um cliente que agrega suas subscriptions de forma razoável precisaria. O limite existe para conter a carga do DSS e seria atingido, por exemplo, por um Display Provider grande que criasse uma subscription para cada visualização de cada usuário.

            No DSS do BR-UTM, o limite é de 10 subscriptions do mesmo cliente em uma mesma célula S2.
      security:
      - Authority:
        - rid.display_provider
      summary: Cria uma subscription do Remote ID
      description: |
        **Escopo:** `rid.display_provider`

        Pede ao DSS notificações de ISAs criadas, alteradas ou removidas em uma área. Usado por quem consome telemetria (Display Provider).

        - A criação falha se já existir uma subscription com o mesmo ID.
        - O intervalo entre `time_start` e `time_end` é de no máximo 24 horas; sem `time_end`, o DSS usa `time_start` + 24 h. Um `time_start` mais de 5 minutos no passado é rejeitado.
        - Cada cliente pode ter no máximo 10 subscriptions em uma mesma célula S2 (`429`).
        - A resposta já traz as ISAs que existem na área naquele momento.

        As notificações de subscription só acontecem quando entidades do DSS são criadas, alteradas ou removidas, e trazem apenas as informações da entidade; não transportam outros dados, como telemetria do Remote ID.
