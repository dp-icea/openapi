  description: Endpoints do DSS para subscriptions do Remote ID.
paths:
  /dss/v1/operational_intent_references/query:
    summary: >-
      Consulta as operational intents do DSS que intersectam uma área geográfica, uma faixa de altitude e um intervalo de tempo.
    description: Interface para as referências de operational intents no DSS.
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryOperationalIntentReferenceParameters'
            examples:
              area:
                summary: Área de 1 km² em São Paulo, 0–120 m, das 14h às 14h30
                value: &id003
                  area_of_interest: &id001
                    volume:
                      outline_polygon:
                        vertices:
                        - lat: -23.55
                          lng: -46.64
                        - lat: -23.55
                          lng: -46.63
                        - lat: -23.54
                          lng: -46.63
                        - lat: -23.54
                          lng: -46.64
                      altitude_lower:
                        value: 0
                        reference: W84
                        units: M
                      altitude_upper:
                        value: 120
                        reference: W84
                        units: M
                    time_start:
                      value: '2026-11-05T14:00:00Z'
                      format: RFC3339
                    time_end:
                      value: '2026-11-05T14:30:00Z'
                      format: RFC3339
        required: true
      tags:
      - Operational intent references
      security:
      - Authority:
        - utm.strategic_coordination
      - Authority:
        - utm.conformance_monitoring_sa
      summary: >-
        Consulta as operational intent references de uma área
      description: |
        **Escopos aceitos** (qualquer uma das opções): `utm.strategic_coordination` ou `utm.conformance_monitoring_sa`

        Devolve as operational intent references cujo envelope (células S2, faixa de altitude e intervalo de tempo) se sobrepõe à `area_of_interest`. É assim que o SW-USS descobre quem já opera numa área antes de planejar uma operação.

        - `area_of_interest` é um Volume4D com contorno (polígono ou círculo), faixa de altitude e intervalo de tempo. Altitude e tempo podem ser omitidos; nesse caso, não há filtro nessas dimensões.
        - O resultado é aproximado: basta compartilhar uma célula S2 de cerca de 1 km² para uma referência ser devolvida. Busque os detalhes de cada uma no SW-USS indicado em `uss_base_url` (`GET /uss/v1/operational_intents/{entityid}`) e verifique a interseção exata com eles.
        - O `ovn` das referências de outros SW-USS vem como `Available from USS`; o OVN correto vem nos detalhes.
        - No máximo 10.000 referências por consulta. Polígonos maiores que 2.500 km² são rejeitados.

        Apesar do verbo POST, esta operação não altera nada no DSS: POST é usado porque nem todas as infraestruturas aceitam corpo em requisições GET.
      operationId: queryOperationalIntentReferences
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryOperationalIntentReferenceResponse'
              examples:
                umaOperacao:
                  summary: Uma operational intent de outro SW-USS na área
                  value:
                    operational_intent_references:
                    - &id002
                      id: 8a4c2f9e-3b7d-4e1a-9c6f-0d2e5b8a7c31
                      manager: empresa-b
                      uss_availability: Unknown
                      version: 2
                      state: Accepted
                      ovn: Available from USS
                      time_start:
                        value: '2026-11-05T14:00:00Z'
                        format: RFC3339
                      time_end:
                        value: '2026-11-05T14:30:00Z'
                        format: RFC3339
                      uss_base_url: https://uss.empresa-b.com.br/utm
                      subscription_id: 0b6d2c4e-8f1a-4e3b-a5c7-9d1f3e5b7a29
          description: As operational intents foram obtidas com sucesso.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Um ou mais parâmetros de entrada estão ausentes ou inválidos.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint.
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A área solicitada é grande demais.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O cliente fez requisições demais em pouco tempo.
  /dss/v1/operational_intent_references/{entityid}:
    summary: >-
      Criação e leitura de uma operational intent reference no DSS.
    parameters:
    - name: entityid
      description: EntityID da operational intent.
      schema:
        $ref: '#/components/schemas/EntityID'
      in: path
      required: true
    get:
      tags:
      - Operational intent references
      security:
      - Authority:
        - utm.strategic_coordination
      - Authority:
        - utm.conformance_monitoring_sa
      summary: >-
        Obtém uma operational intent reference
      operationId: getOperationalIntentReference
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOperationalIntentReferenceResponse'
          description: A operational intent reference foi obtida com sucesso.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Um ou mais parâmetros de entrada estão ausentes ou inválidos.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A entidade solicitada não foi encontrada.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O cliente fez requisições demais em pouco tempo.
      description: |
        **Escopos aceitos** (qualquer uma das opções): `utm.strategic_coordination` ou `utm.conformance_monitoring_sa`

        Devolve a operational intent reference com o ID informado. Se ela for de outro SW-USS, o `ovn` vem como `Available from USS`.

        Use para conferir o estado e a versão atuais de uma referência. Os detalhes (volumes exatos, prioridade etc.) só existem no SW-USS que a gerencia.
    put:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutOperationalIntentReferenceParameters'
            examples:
              accepted:
                summary: Criação em Accepted, com subscription implícita que notifica constraints
                value:
                  extents:
                  - *id001
                  key:
                  - Y-8pfahhmSGR1Mnuv1Oc-.HOK5MhF67-v2Fo8uvev.k_
                  - xrjOayrr64dKAR6MZR2rVUOpqC8FsDntbACrOOMCgjw_
                  state: Accepted
                  uss_base_url: https://uss.empresa-a.com.br/utm
                  new_subscription:
                    uss_base_url: https://uss.empresa-a.com.br/utm
                    notify_for_constraints: true
        required: true
      tags:
      - Operational intent references
      security:
      - Authority:
        - utm.strategic_coordination
      - Authority:
        - utm.strategic_coordination
        - utm.constraint_processing
      - Authority:
        - utm.conformance_monitoring_sa
      summary: Cria uma operational intent reference
      operationId: createOperationalIntentReference
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOperationalIntentReferenceResponse'
              examples:
                criada:
                  summary: Referência criada; notifique os dois subscribers
                  value:
                    operational_intent_reference:
                      id: 2f8343be-6482-4d1b-a474-16847e01af1e
                      manager: empresa-a
                      uss_availability: Unknown
                      version: 1
                      state: Accepted
                      ovn: v.v5qNvwU.VccnOCgBA-CEfqltpTC-3qN-2iKbRusEQ_
                      time_start:
                        value: '2026-11-05T14:00:00Z'
                        format: RFC3339
                      time_end:
                        value: '2026-11-05T14:30:00Z'
                        format: RFC3339
                      uss_base_url: https://uss.empresa-a.com.br/utm
                      subscription_id: 78ea3fe8-71c2-4f5c-9b44-9c02f5563c6f
                    subscribers:
                    - uss_base_url: https://uss.empresa-b.com.br/utm
                      subscriptions:
                      - subscription_id: 0b6d2c4e-8f1a-4e3b-a5c7-9d1f3e5b7a29
                        notification_index: 7
                    - uss_base_url: https://uss.empresa-a.com.br/utm
                      subscriptions:
                      - subscription_id: 78ea3fe8-71c2-4f5c-9b44-9c02f5563c6f
                        notification_index: 1
          description: >-
            A operational intent reference foi criada com sucesso no DSS.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            * Um ou mais parâmetros de entrada estão ausentes ou inválidos.
            * A requisição tentou alterar a operational intent de uma forma não permitida.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AirspaceConflictResponse'
              examples:
                faltaOvn:
                  summary: Faltou o OVN da operational intent da empresa B na key
                  value:
                    message: Current OVNs not provided for one or more OperationalIntents or Constraints
                    missing_operational_intents:
                    - *id002
          description: |
            * A `key` enviada não prova o conhecimento de todas as entidades atuais e relevantes do espaço aéreo (o corpo da resposta traz `missing_operational_intents` e/ou `missing_constraints`).
            * Apesar de várias tentativas, o DSS não conseguiu concluir a alteração por causa de outras alterações simultâneas.
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A área da operational intent é grande demais.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O cliente fez requisições demais em pouco tempo.
      description: |
        **Escopos aceitos** (qualquer uma das opções): `utm.strategic_coordination` ou `utm.strategic_coordination` + `utm.constraint_processing` ou `utm.conformance_monitoring_sa`

        Registra no DSS a referência de uma nova operational intent. O `entityid` é um UUIDv4 gerado pelo seu SW-USS.

        1. Consulte a área em `POST /dss/v1/operational_intent_references/query` e em `POST /dss/v1/constraint_references/query`, e busque os detalhes das entidades encontradas.
        2. Verifique os conflitos com os volumes exatos. Se a operational intent intersectar uma constraint, ela não poderá ser ativada.
        3. Envie a criação com `state: Accepted` (o único estado aceito na criação), os `extents`, o `uss_base_url` do seu SW-USS, `new_subscription` com `notify_for_constraints: true` e, em `key`, os OVNs das operational intents e das constraints encontradas.
        4. Se faltar algum OVN, o DSS responde `409` com `missing_operational_intents` e/ou `missing_constraints`. Busque os detalhes dessas entidades, acrescente os OVNs à `key` e repita.
        5. Guarde o `ovn` da resposta (necessário para atualizar ou remover) e notifique cada SW-USS listado em `subscribers` com `POST /uss/v1/operational_intents`.

        Use um token com `utm.strategic_coordination` e `utm.constraint_processing`, o conjunto necessário para pedir notificações de constraints.

        Validações do DSS:

        - Os `extents` não podem terminar no passado, e o fim deve ser posterior ao início.
        - Com `new_subscription`, o DSS cria uma subscription implícita que cobre a operação. Em vez disso, você pode informar em `subscription_id` uma subscription sua que cubra a operação no espaço e no tempo; caso contrário, `400`.
        - O DSS não lê nem guarda o campo `flight_type`.
  /dss/v1/operational_intent_references/{entityid}/{ovn}:
    summary: >-
      Atualização e remoção de uma operational intent reference no DSS.
    parameters:
    - name: entityid
      description: EntityID da operational intent.
      schema:
        $ref: '#/components/schemas/EntityID'
      in: path
      required: true
    - name: ovn
      description: >-
        OVN (opaque version number) atual da operational intent reference.
      schema:
        $ref: '#/components/schemas/EntityOVN'
      in: path
      required: true
    put:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutOperationalIntentReferenceParameters'
            examples:
              activated:
                summary: Ativação, mantendo a subscription implícita criada antes
                value:
                  extents:
                  - *id001
                  key:
                  - Y-8pfahhmSGR1Mnuv1Oc-.HOK5MhF67-v2Fo8uvev.k_
                  - xrjOayrr64dKAR6MZR2rVUOpqC8FsDntbACrOOMCgjw_
                  state: Activated
                  uss_base_url: https://uss.empresa-a.com.br/utm
                  subscription_id: 78ea3fe8-71c2-4f5c-9b44-9c02f5563c6f
        required: true
      tags:
      - Operational intent references
      security:
      - Authority:
        - utm.strategic_coordination
      - Authority:
        - utm.strategic_coordination
        - utm.constraint_processing
      - Authority:
        - utm.conformance_monitoring_sa
      summary: Atualiza uma operational intent reference
      operationId: updateOperationalIntentReference
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOperationalIntentReferenceResponse'
              examples:
                ativada:
                  summary: Referência ativada, com novo OVN
                  value:
                    operational_intent_reference:
                      id: 2f8343be-6482-4d1b-a474-16847e01af1e
                      manager: empresa-a
                      uss_availability: Unknown
                      version: 2
                      state: Activated
                      ovn: 6LsTWURy3osoT7kkrJc3VuPyGbuc7TOK0l7kfkv8hYI_
                      time_start:
                        value: '2026-11-05T14:00:00Z'
                        format: RFC3339
                      time_end:
                        value: '2026-11-05T14:30:00Z'
                        format: RFC3339
                      uss_base_url: https://uss.empresa-a.com.br/utm
                      subscription_id: 78ea3fe8-71c2-4f5c-9b44-9c02f5563c6f
                    subscribers:
                    - uss_base_url: https://uss.empresa-b.com.br/utm
                      subscriptions:
                      - subscription_id: 0b6d2c4e-8f1a-4e3b-a5c7-9d1f3e5b7a29
                        notification_index: 8
                    - uss_base_url: https://uss.empresa-a.com.br/utm
                      subscriptions:
                      - subscription_id: 78ea3fe8-71c2-4f5c-9b44-9c02f5563c6f
                        notification_index: 2
          description: >-
            A operational intent reference foi atualizada com sucesso no DSS.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            * Um ou mais parâmetros de entrada estão ausentes ou inválidos.
            * A requisição tentou alterar a operational intent de uma forma não permitida.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AirspaceConflictResponse'
          description: |
            * A `key` enviada não prova o conhecimento de todas as entidades atuais e relevantes do espaço aéreo (o corpo da resposta traz `missing_operational_intents` e/ou `missing_constraints`).
            * O `ovn` enviado não corresponde à versão atual da operational intent.
            * Apesar de várias tentativas, o DSS não conseguiu concluir a alteração por causa de outras alterações simultâneas.
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A área da operational intent é grande demais.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O cliente fez requisições demais em pouco tempo.
      description: |
        **Escopos aceitos** (qualquer uma das opções): `utm.strategic_coordination` ou `utm.strategic_coordination` + `utm.constraint_processing` ou `utm.conformance_monitoring_sa`

        Substitui a referência por uma nova versão: mudança de estado (ex.: `Accepted` → `Activated`), de volumes ou de subscription. Envie no caminho o `ovn` atual, o que o DSS devolveu na última criação ou atualização. Só o `manager` (o `sub` do token que criou a referência) pode atualizá-la, e um `ovn` diferente do atual resulta em `409`.

        - Uma operational intent que intersecta uma constraint não pode ser passada para `Activated`.
        - Em `Accepted` e `Activated`, valem as mesmas regras de `key` da criação: consulte a área, busque os detalhes e envie os OVNs. Um `409` com `missing_*` indica o que falta. Em `Nonconforming` e `Contingent`, a `key` não é exigida.
        - Passar para `Nonconforming` ou `Contingent` exige o escopo `utm.conformance_monitoring_sa` no token; sem ele, `403`.
        - Informe a subscription em toda atualização: `subscription_id` (por exemplo, o da subscription implícita criada antes, que o DSS amplia se a operação crescer) ou `new_subscription`. Sem nenhum dos dois, a operational intent fica sem subscription, o que só é aceito em `Accepted`.
        - O DSS procura as subscriptions afetadas na área nova e na antiga. Notifique cada SW-USS listado em `subscribers` com `POST /uss/v1/operational_intents` e guarde o novo `ovn` da resposta.
