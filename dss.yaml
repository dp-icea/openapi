                $ref: '#/components/schemas/RidErrorResponse'
          description: Um ou mais parâmetros de entrada estão ausentes ou inválidos.
        401:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
          description: O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        403:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidErrorResponse'
