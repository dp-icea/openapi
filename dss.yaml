    put:
      security:
      - Authority:
        - utm.constraint_processing
      - Authority:
        - utm.strategic_coordination
      summary: Cria uma subscription
      operationId: createSubscription
      description: |
        **Escopos aceitos** (qualquer uma das opções): `utm.constraint_processing` ou `utm.strategic_coordination`

        Cria uma subscription avulsa: uma área e um intervalo de tempo em que você quer ser notificado de mudanças em operational intents (`notify_for_operational_intents`) e/ou em constraints (`notify_for_constraints`). Pelo menos uma das duas opções deve ser verdadeira.

        O DSS do BR-UTM não confere o escopo de cada tipo de notificação: com qualquer um dos escopos aceitos, a subscription pode pedir notificações de operational intents, de constraints ou de ambas. Conferir o escopo de cada tipo é uma melhoria prevista do DSS.

        Um SW-USS que só opera voos em geral não precisa de subscriptions avulsas: a subscription implícita, pedida com `new_subscription` ao criar ou atualizar a operational intent, já cobre a operação. Subscriptions avulsas servem a quem quer acompanhar uma área, como um visualizador.

        - O `uss_base_url` é a URL base em que o seu SW-USS recebe as notificações (`POST /uss/v1/operational_intents` e `POST /uss/v1/constraints`).
        - A resposta já traz as operational intents e/ou constraints que existem na área naquele momento.
        - A criação falha se já existir uma subscription com o mesmo ID.

        As notificações de subscription só acontecem quando entidades do DSS são criadas, alteradas ou removidas, e trazem apenas as informações da entidade; não transportam outros dados, como telemetria do Remote ID.
