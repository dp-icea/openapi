      - Authority:
        - utm.constraint_processing
      - Authority:
        - utm.strategic_coordination
      summary: Atualiza uma subscription
      operationId: updateSubscription
      description: |
        **Escopos aceitos** (qualquer uma das opções): `utm.constraint_processing` ou `utm.strategic_coordination`

        Substitui a subscription por uma nova versão. Envie no caminho a `version` atual; só o dono pode alterar.

        O DSS do BR-UTM não confere o escopo de cada tipo de notificação: com qualquer um dos escopos aceitos, a subscription pode pedir notificações de operational intents, de constraints ou de ambas. Conferir o escopo de cada tipo é uma melhoria prevista do DSS.

        A norma exige que cada operational intent tenha uma subscription que cubra o seu volume 4D. Se a alteração fizer uma operational intent dependente perder essa cobertura, o DSS a rejeita com `400`.

        As notificações de subscription só acontecem quando entidades do DSS são criadas, alteradas ou removidas, e trazem apenas as informações da entidade; não transportam outros dados, como telemetria do Remote ID.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSubscriptionParameters'
        required: true
      tags:
      - Subscriptions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutSubscriptionResponse'
          description: A subscription foi atualizada com sucesso.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            * Um ou mais parâmetros de entrada estão ausentes ou inválidos.
            * A requisição tentou alterar a subscription de uma forma não permitida.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            * O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint ou à requisição.
            * O cliente pediu notificações de um tipo de entidade a que os escopos do token não dão acesso.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            * Já existe uma subscription com o ID informado, gerenciada por outro cliente.
            * A `version` enviada não corresponde à versão atual da subscription.
            * Apesar de várias tentativas, o DSS não conseguiu concluir a alteração por causa de outras alterações simultâneas.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O cliente pode ter feito requisições demais em pouco tempo.
    delete:
      tags:
      - Subscriptions
      security:
      - Authority:
        - utm.constraint_processing
      - Authority:
        - utm.strategic_coordination
      summary: Remove uma subscription
      operationId: deleteSubscription
      description: |
        **Escopos aceitos** (qualquer uma das opções): `utm.constraint_processing` ou `utm.strategic_coordination`

        Remove a subscription. Envie no caminho a `version` atual; só o dono pode remover.

        Uma subscription de que alguma operational intent depende não pode ser removida (`400`). Subscriptions implícitas são removidas pelo próprio DSS junto com a operational intent.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSubscriptionResponse'
          description: A subscription foi removida do DSS com sucesso.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Um ou mais parâmetros de entrada estão ausentes ou inválidos.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Não existe subscription com o ID informado.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            * A subscription com o ID informado é gerenciada por outro cliente.
            * A `version` enviada não corresponde à versão atual da subscription.
            * Apesar de várias tentativas, o DSS não conseguiu concluir a remoção por causa de outras alterações simultâneas.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O cliente fez requisições demais em pouco tempo.

