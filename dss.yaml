        **Escopo:** `rid.display_provider`

        Devolve as subscriptions **do próprio cliente** que se sobrepõem a `area`. Serve para recuperar subscriptions perdidas ou resolver o erro de excesso de subscriptions numa área.

        As notificações de subscription só acontecem quando entidades do DSS são criadas, alteradas ou removidas, e trazem apenas as informações da entidade; não transportam outros dados, como telemetria do Remote ID.
  /rid/v2/dss/subscriptions/{id}:
    summary: Subscription para receber atualizações do espaço aéreo em um volume de interesse.
    parameters:
    - name: id
