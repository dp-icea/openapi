      - Authority:
        - rid.display_provider
      - Authority:
        - rid.service_provider
      summary: Obtém uma subscription do Remote ID
      description: |
        **Escopos aceitos** (qualquer uma das opções): `rid.display_provider` ou `rid.service_provider`

        Verifica a existência, a validade e o estado de uma subscription.
    put:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionParameters'
        required: true
      tags:
      - Subscriptions (Remote ID)
      operationId: createRidSubscription
      responses:
        200:
          content:
            application/json:
              schema:
