                  summary: Voo planejado
                  value:
                    planning_result: Completed
                    flight_plan_status: Planned
                    includes_advisories: NoAdvisoriesOrConditions
                ativado:
                  summary: Voo ativado
                  value:
                    planning_result: Completed
                    flight_plan_status: OkToFly
                    includes_advisories: NoAdvisoriesOrConditions
                rejeitado:
                  summary: Ativação rejeitada por conflito
                  value:
                    planning_result: Rejected
                    notes: O voo intersecta a operational intent c036326c-c97b-4926-bf9f-c60dc83d2b57, de outro SW-USS, já ativada e de mesma prioridade.
                    flight_plan_status: Planned
                    includes_advisories: AtLeastOneAdvisoryOrCondition
          description: Os dados foram processados com sucesso.
        '401':
          description: O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        '403':
          description: O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint.
        '409':
          description: A requisição tem um `request_id` repetido e a resposta daquele pedido não está disponível, ou houve outro conflito.

      summary: Cria ou altera um plano de voo (usuário virtual)
      operationId: UpsertFlightPlan
      description: |
        **Escopo exigido no token de quem chama:** `interuss.flight_planning.plan`

        Simula um operador pedindo para criar ou alterar um voo. Trate como um pedido real, pelo mesmo caminho de código usado pela sua interface do operador: verificação da Zona UTM, consulta ao DSS, desconflitação e criação ou alteração da operational intent.

        - `flight_plan_id` é o ID do voo do ponto de vista do usuário (UUID). Pedidos seguintes com o mesmo ID alteram o mesmo voo.
        - `flight_plan.basic_information.usage_state` diz o que o usuário está fazendo: `Planned` (voo planejado), `InUse` (voo em andamento) ou `Closed` (voo encerrado).
        - `execution_style`: `Hypothetical` (só informe o resultado provável), `IfAllowed` (execute se for permitido) ou `InReality` (o usuário já está fazendo isso, seja permitido ou não).
        - `flight_plan.telemetry` traz posições a entregar ao seu sistema nos instantes indicados, como se viessem do drone; elas alimentam o monitoramento de conformidade.
        - Responda com `planning_result` (`Completed`, `Rejected`, `Failed` ou `NotSupported`) e `flight_plan_status`. Em qualquer resultado diferente de `Completed`, explique o motivo em `notes`. Um pedido de voo em `Planned` que conflita com outra operational intent não é rejeitado por esse conflito; já a passagem para `InUse` é rejeitada (`Rejected`) se o voo tiver conflitos pelas regras de ativação de `sw-uss.yaml`.
        - Se o `request_id` se repetir, devolva a resposta do primeiro pedido com o mesmo `request_id`, sem executar a ação de novo. Responda `409` só se essa resposta não estiver mais disponível.

        Os testes também verificam o comportamento do SW-USS com prioridades maiores e menores, embora no BR-UTM se use uma única prioridade por enquanto.

      tags:
      - Flight planning
    delete:
      security:
      - Authority:
        - interuss.flight_planning.direct_automated_test

      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteFlightPlanResponse'
              examples:
                removido:
                  summary: Plano de voo removido
                  value:
                    planning_result: Completed
                    flight_plan_status: Closed
                    includes_advisories: NoAdvisoriesOrConditions
                falha:
                  summary: Falha ao remover
                  value:
                    planning_result: Failed
                    notes: O DSS não respondeu ao pedido de remoção da operational intent 2f8343be-6482-4d1b-a474-16847e01af1e.
                    flight_plan_status: Planned
                    includes_advisories: Unknown
          description: O plano de voo foi removido com sucesso.
        '401':
          description: O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        '403':
          description: O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint.
        '404':
          description: O plano de voo não foi encontrado (talvez já tenha sido removido).

      summary: Remove um plano de voo
      operationId: DeleteFlightPlan
      description: |
        **Escopo exigido no token de quem chama:** `interuss.flight_planning.direct_automated_test`

        Pedido do diretor de testes: encerre e remova um plano de voo que não é mais necessário para os testes, inclusive a operational intent correspondente no DSS. Responda `404` se o plano de voo não existir (talvez já tenha sido removido).

      tags:
      - Flight planning
  /flight_planning/v1/user_notifications:
    get:
      operationId: QueryUserNotifications
      security:
      - Authority:
        - interuss.flight_planning.plan
      parameters:
      - name: after
        description: >-
          Não inclua notificações observadas antes deste instante. A comparação usa a propriedade `observed_at` de `UserNotification`.
        schema:
          type: string
          format: date-time
        example: '2026-11-05T13:45:00Z'
        in: query
        required: true
      - name: before
        description: >-
          Não inclua notificações observadas depois deste instante, que deve ser posterior ao de `after`. Se não for informado, vale o momento atual. A comparação usa a propriedade `observed_at` de `UserNotification`.
        schema:
          type: string
          format: date-time
