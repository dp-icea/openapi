openapi: 3.0.2
info:
  title: 'SW-USS: homologação'
  version: 1.0.2
  description: |
    Interfaces de teste que o SW-USS expõe para a homologação. Quem chama é o BR-UTM Lab (DECEA), não os outros SW-USS; a interface de Versioning também é consultada em produção por um serviço do DECEA.

    As interfaces são uma adaptação das `automated_testing_interfaces` da InterUSS: Flight Planning (v0.7.0), Remote ID Injection (v0.5.1) e Versioning (v0.1.2). Os schemas que elas importavam de outros arquivos da InterUSS foram copiados para `components`, e os campos específicos de outras jurisdições (como os da União Europeia e da Austrália) foram removidos. A interface de Versioning ganhou, no BR-UTM, a versão do SW-USS como um todo (`GET /versioning/versions/sw-uss`) e a listagem dos subsistemas (`GET /versioning/versions`).

    ## Homologação e produção

    **Flight Planning e Remote ID Injection** servem só para a homologação: com elas, o BR-UTM Lab testa as interações e as funções do SW-USS.

    - Cabe à empresa manter ou não esses endpoints em produção. O restante do SW-USS, porém, **deve funcionar em produção exatamente como foi testado na validação**. Se não for possível remover esses endpoints sem outras mudanças no sistema, mantenha-os.
    - Mantê-los não expõe o SW-USS: eles exigem escopos de teste que os SW-USS comuns não recebem, nem em produção nem em desenvolvimento.

    **Versioning é obrigatória sempre, inclusive em produção.** Um serviço do DECEA em produção confere se a versão do SW-USS é a mesma usada para criar a chave de API de produção em uso.

    ## Processo de homologação

    Pela ICA 100-48 (Art. 14), um SW-USS Aprovado é o software validado pela plataforma BR-UTM Lab, mediante solicitação formal da entidade autorizada. O processo:

    1. A empresa pede a aprovação no Portal BR-UTM, informando um e-mail de contato e a versão do software.
    2. A equipe do BR-UTM Lab cria um ambiente próprio para a validação e envia a chave de API e os endpoints de acesso. A empresa configura o SW-USS com esses endereços e chaves e responde por e-mail com a URL base destas interfaces (ver "URLs base").
    3. A equipe faz a validação. O processo é manual, mas em alguns casos usa uma ferramenta automatizada interna, que chama estas interfaces.
    4. Erros de fácil correção podem ser corrigidos na mesma solicitação; nos demais casos, a solicitação é negada e é preciso fazer outra.
    5. Com a aprovação, a empresa cria no Portal a chave de API de produção para aquela versão e pode pedir uma Zona UTM.
    6. No final da homologação, a empresa informa ao DECEA a URL base (ou as URLs base) dos endpoints de logs do SW-USS (`sw-uss.yaml`). O DECEA as registra só para uso interno.

    **Atualizações.** Pela ICA 100-48 (Art. 84), antes de atualizar o SW-USS, o USS submete a versão atualizada à análise do ICEA, que avalia se a modificação é pequena ou grande. Recomenda-se submeter cada nova versão a uma nova validação no BR-UTM Lab. Se a mudança for mínima e a empresa entender que se trata de uma versão menor, ela pode contatar os responsáveis do DECEA pelo SAC antes de abrir uma solicitação de validação. Para avaliar o que mudou entre uma versão e outra, o DECEA consulta as versões dos subsistemas na interface de Versioning.

    ## URLs base

    Os caminhos deste arquivo ficam sob uma URL base escolhida pela empresa, que pode ser diferente das registradas no DSS para as operational intents e para o Remote ID. Ex.: as operational intents em `https://oi.empresa-a.com.br` e estas interfaces em `https://homologacao.empresa-a.com.br`. Informe essa URL base ao DECEA por e-mail, depois do contato da equipe do BR-UTM Lab (passo 2 do processo).

    A URL base precisa ser acessível pelo BR-UTM Lab e não pode terminar com `/`. Em produção, ela também precisa ser acessível pelo serviço do DECEA que consulta a interface de Versioning.

    ## Estrutura interna sugerida

    Primeiramente, cabe à empresa identificar quais componentes internos do SW-USS cada interface deve acionar e implementá-la de forma adequada:

    - **Flight Planning:** esta interface testa o que o operador faz no SW-USS. Por isso, ela deve acionar, da forma mais fiel possível, os mesmos componentes com que o operador interage (interface gráfica, API própria de planejamento, integração com a estação de controle de solo etc.). Se for preciso, implemente-a como um robô que opera esses componentes como um operador faria. Os estados do plano de voo equivalem aos da operational intent: `Planned` → `Accepted`; `InUse` → `Activated`; `Closed` → o voo termina e a operational intent é removida do DSS. Guarde as notificações que o operador veria (como avisos de conflito) para `GET /flight_planning/v1/user_notifications`.
    - **Remote ID Injection:** da mesma forma, faça a telemetria injetada entrar no SW-USS o mais perto possível do ponto por onde entra a telemetria que o drone envia durante a operação. Assim, os voos injetados seguem o mesmo fluxo dos voos reais e aparecem em `GET /uss/flights` e `GET /uss/flights/{id}/details` (`sw-uss.yaml`) nos instantes certos. O mesmo vale para a telemetria que chega no plano de voo do Flight Planning, que entra no monitoramento de conformidade como se viesse do drone.

    **Formatos.** Os dados recebidos nestas interfaces não vêm no formato das APIs do BR-UTM, de propósito: o plano de voo, por exemplo, não chega como operational intent. O BR-UTM não exige que nenhuma interface interna do SW-USS (como a interface do operador) siga o formato da ASTM F3548-21. As interfaces internas podem usar qualquer formato, mas, no fim, o SW-USS converte os dados para os formatos das APIs do BR-UTM:

    - o plano de voo (`FlightPlan`) vira uma operational intent (`dss.yaml` e `sw-uss.yaml`);
    - os voos injetados no Remote ID (`TestFlight`) são fornecidos com os schemas de `GET /uss/flights` e `GET /uss/flights/{id}/details` (`sw-uss.yaml`). Por exemplo, o `timestamp` de `RIDAircraftState` é um texto RFC 3339 nesta interface e um objeto `Time` em `sw-uss.yaml`.

    ## Versioning

    A homologação aprova uma versão específica do SW-USS: a informada no Portal BR-UTM no pedido de aprovação. Como o SW-USS pode ser um conjunto de sistemas (APIs, interfaces gráficas, estações de controle de solo etc.), essa versão representa o conjunto. A interface de Versioning informa:

    - **`system_identity` = `sw-uss`** (obrigatório): a versão do SW-USS como um todo, exatamente como informada no Portal BR-UTM. É ela que o serviço do DECEA em produção compara com a versão associada à chave de API em uso.
    - **Subsistemas** (recomendado): a versão de cada sistema que compõe o SW-USS, com um `system_identity` escolhido pela empresa. O DECEA usa essas versões para ver o que mudou entre uma versão do SW-USS e outra e avaliar se a mudança é pequena ou grande.

    São três endpoints, todos obrigatórios, inclusive em produção:

    - `GET /versioning/versions/sw-uss`: a versão do SW-USS como um todo;
    - `GET /versioning/versions`: o `sw-uss` e todos os subsistemas, com as suas versões;
    - `GET /versioning/versions/{system_identity}`: a versão de um subsistema.

    ## Autenticação

    O BR-UTM Lab chama estas interfaces com `Authorization: Bearer <token>`, um token emitido pelo mesmo Auth Server do BR-UTM (a mesma chave valida os tokens do UTM, do Remote ID e destas interfaces). Valide-o como nos demais endpoints do SW-USS: `iss` igual a `ICEA`, `aud` igual ao domínio em que a interface responde e, em `scope`, o escopo exigido, informado no início da descrição de cada endpoint. Responda `401` a um token ausente ou inválido e `403` a um token sem o escopo exigido.

    ## Schemas

    Schemas da injeção de Remote ID com o mesmo nome de um schema do planejamento de voo, mas conteúdo diferente, recebem o prefixo `Rid` (ex.: `RidUserNotification`), assim como o operationId `RidQueryUserNotifications`.
servers:
- url: '{uss_base_url}'
  description: URL base das interfaces de homologação, informada ao DECEA por e-mail
  variables:
    uss_base_url:
      default: https://homologacao.empresa-a.com.br
      description: URL base, sem `/` no fim
security:
- Authority:
  - interuss.flight_planning.plan
  - interuss.flight_planning.direct_automated_test
  - rid.inject_test_data
  - interuss.versioning.read_system_versions
tags:
- name: Flight planning
  description: |
    Flight Planning Automated Testing Interface 0.7.0 (InterUSS).

    Interface fornecida por um SW-USS que participa de testes automatizados de planejamento de voos.

    O BR-UTM Lab dá instruções a um usuário virtual que usa a interface de planejamento do SW-USS para planejar, alterar e encerrar planos de voo. O BR-UTM Lab fornece as informações que um usuário forneceria ao SW-USS, e o SW-USS responde só com as informações que daria aos seus usuários normais na mesma ação. O SW-USS deve executar essas ações usando, tanto quanto possível, os mesmos caminhos de código que atendem um usuário normal.

    Com outro escopo, o BR-UTM Lab também pode agir como diretor de testes: verificar o estado do sistema em teste e pedir que a área de teste seja limpa de planos de voo remanescentes. Para isso, o SW-USS pode usar caminhos de código fora do padrão ou não disponíveis aos usuários normais.

    Observação: salvo indicação em contrário, campos de uma mensagem que não estejam declarados na API, ou que não sejam conhecidos pelo servidor ou pelo cliente, devem ser ignorados.
- name: Remote ID injection
  description: |
    Remote ID Test Data Injection 0.5.1 (InterUSS).

    Interface fornecida por todo Service Provider que vai ser testado pelo BR-UTM Lab. O BR-UTM Lab chama esta interface para injetar dados de voo de teste no Service Provider em teste.
- name: Versioning
  description: |
    Versioning Automated Testing Interface 0.1.2 (InterUSS).

    Interface fornecida por um SW-USS para informar, de forma automatizada, as versões do seu software a destinatários autorizados.

    Observação: salvo indicação em contrário, campos de uma mensagem que não estejam declarados na API, ou que não sejam conhecidos pelo servidor ou pelo cliente, devem ser ignorados.
paths:
  /flight_planning/v1/status:
    get:
      security:
      - Authority:
        - interuss.flight_planning.direct_automated_test
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              examples:
                pronta:
                  summary: Interface pronta
                  value:
                    status: Ready
                    api_name: Flight Planning Automated Testing Interface
                    api_version: v0.7.0
                iniciando:
                  summary: Interface ainda iniciando
                  value:
                    status: Starting
                    api_name: Flight Planning Automated Testing Interface
                    api_version: v0.7.0
          description: >-
            Esta interface de teste está disponível, e o seu estado foi obtido com sucesso.
        '401':
          description: O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        '403':
          description: O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint.
        '404':
          description: Esta interface de teste não está disponível.
      summary: Informa se a interface de planejamento está pronta
      description: |
        **Escopo exigido no token de quem chama:** `interuss.flight_planning.direct_automated_test`

        Informa se a interface de planejamento de voo está pronta para os testes: `Starting` (ainda iniciando) ou `Ready` (pronta). O BR-UTM Lab consulta este endpoint antes de começar. Responda `404` se a interface não estiver disponível.

        Em `api_name` e `api_version`, devolva exatamente `Flight Planning Automated Testing Interface` e `v0.7.0`.
      operationId: GetStatus

      tags:
      - Flight planning
  /flight_planning/v1/clear_area_requests:
    post:
      security:
      - Authority:
        - interuss.flight_planning.direct_automated_test

      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearAreaRequest'
            examples:
              limpar:
                summary: Limpar a área de teste no centro de São Paulo
                value:
                  request_id: 5b7f9c2e-1d4a-4e8b-a6f3-0c9d2e7b4a51
                  extent:
                    volume:
                      outline_circle:
                        center:
                          lat: -23.5505
                          lng: -46.638
                        radius:
                          value: 2000
                          units: M
                      altitude_lower:
                        value: 0
                        reference: W84
                        units: M
                      altitude_upper:
                        value: 3000
                        reference: W84
                        units: M
                    time_start:
                      value: '2026-11-05T00:00:00Z'
                      format: RFC3339
                    time_end:
                      value: '2026-11-06T00:00:00Z'
                      format: RFC3339
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearAreaResponse'
              examples:
                sucesso:
                  summary: Área limpa
                  value:
                    outcome:
                      success: true
                falha:
                  summary: Falha ao limpar a área
                  value:
                    outcome:
                      success: false
                      message: O DSS respondeu 500 ao remover a operational intent 57e98b17-aefa-4eee-a376-5140e4a8385f.
                      details:
                        dss_status: 500
                        operational_intent_id: 57e98b17-aefa-4eee-a376-5140e4a8385f
          description: A área foi limpa com sucesso.
        '401':
          description: O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        '403':
          description: O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint.

      summary: Limpa uma área de teste
      operationId: ClearArea
      description: |
        **Escopo exigido no token de quem chama:** `interuss.flight_planning.direct_automated_test`

        Pedido do diretor de testes: cancele e remova todos os planos de voo gerenciados pelo seu SW-USS que intersectam `extent`, inclusive as operational intents correspondentes no DSS. Serve para limpar a área entre cenários de teste, e pode usar caminhos de código administrativos.

        - Responda com `success: true` só se todos os planos de voo da área foram cancelados e removidos; caso contrário, explique o problema em `message`.
        - Se o `request_id` se repetir, devolva a resposta do pedido anterior com o mesmo `request_id`, sem limpar a área de novo.

      tags:
      - Flight planning
  /flight_planning/v1/flight_plans/{flight_plan_id}:
    parameters:
    - name: flight_plan_id
      in: path
      required: true
      description: Texto no formato UUID que identifica a intenção de plano de voo do usuário.
      schema:
        $ref: '#/components/schemas/FlightPlanID'

    put:
      security:
      - Authority:
        - interuss.flight_planning.plan

      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertFlightPlanRequest'
