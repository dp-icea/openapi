                    details:
                      volumes:
                      - volume: *id004
                        time_start:
                          value: '2026-11-05T00:00:00Z'
                          format: RFC3339
                        time_end:
                          value: '2026-11-06T00:00:00Z'
                          format: RFC3339
                  subscriptions:
                  - subscription_id: 78ea3fe8-71c2-4f5c-9b44-9c02f5563c6f
                    notification_index: 3
        required: true
      responses:
