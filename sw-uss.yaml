  /uss/v1/reports:
    summary: Relatos de problemas de comunicação com um SW-USS.
    post:
      tags:
      - Reports
      security:
      - Authority:
        - utm.strategic_coordination
      - Authority:
        - utm.constraint_processing
      - Authority:
        - utm.constraint_management
      - Authority:
        - utm.conformance_monitoring_sa
      - Authority:
        - utm.availability_arbitration
      summary: >-
        Recebe o relato de um problema
      operationId: makeUssReport
      description: |
        **Escopos aceitos no token de quem chama** (qualquer uma das opções): `utm.strategic_coordination` ou `utm.constraint_processing` ou `utm.constraint_management` ou `utm.conformance_monitoring_sa` ou `utm.availability_arbitration`

        **Quem chama:** outros participantes do ECO-UTM.

        Recebe de outro participante o relato de um problema (por exemplo, um erro de comunicação) relacionado a operational intents ou constraints, que o seu SW-USS talvez não tenha percebido. Responda `201` com o relato e um `report_id` atribuído pelo seu SW-USS.

        No BR-UTM, este endpoint é obrigatório.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorReport'
            examples:
              semResposta:
                summary: Relato de uma notificação que ficou sem resposta
