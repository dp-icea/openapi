openapi: 3.0.2
info:
  title: SW-USS
  version: 1.0.0
  description: |
    Endpoints que todo SW-USS (Gerenciador de Operações) expõe aos demais participantes do BR-UTM. O seu SW-USS também chama estes mesmos endpoints nos outros SW-USS: o contrato é o mesmo nos dois sentidos.

    ## O que é o SW-USS

    O SW-USS é o sistema que fica entre o operador, de um lado, e o ECO-UTM, do outro: o Auth Server, o DSS, o Provedor de Zona UTM, os Gerenciadores de Constraints e os demais SW-USS. É por ele que o operador voa o drone e que o restante do UTM fica sabendo dessas operações.

    O SW-USS não é necessariamente um único programa ou uma única API REST. Ele pode ser desde uma única API REST até um conjunto de várias APIs, interfaces gráficas, estações de controle de solo (GCS), gerenciamento de usuários etc. O que vale é o conjunto:

    - **Na homologação, o BR-UTM Lab valida o sistema inteiro**, não uma API isolada.
    - **Os logs que o DECEA pede são os do sistema inteiro**, de todas as suas partes.
    - **O SW-USS pode responder em vários domínios** (ver "URLs base e domínios").

    Uma única API REST em um único domínio é o arranjo mais simples, mas o BR-UTM aceita arranjos mais complexos, se o SW-USS precisar.

    ## URLs base e domínios

    Cada endpoint deste arquivo é chamado na URL base que o seu SW-USS registrou na entidade correspondente:

    - **`uss_base_url` da operational intent reference:** `GET /uss/v1/operational_intents/{entityid}` e `GET /uss/v1/operational_intents/{entityid}/telemetry`.
    - **`uss_base_url` da subscription do UTM** (implícita ou não): `POST /uss/v1/operational_intents` e `POST /uss/v1/constraints`.
    - **`uss_base_url` da Identification Service Area:** `GET /uss/flights`, `GET /uss/flights/{id}/details` e `GET /uss/identification_service_areas/{id}`.
    - **`uss_base_url` da subscription do Remote ID:** `POST /uss/identification_service_areas/{id}`.
    - **Endpoints de logs** (`GET /uss/v1/log_sets` e `GET /uss/v1/log_sets/{log_set_id}`): a URL base (ou as URLs base) informada ao DECEA no final da homologação. O DECEA registra essas URLs só para uso interno; nenhum outro participante as usa.

    Essas URLs podem ser diferentes. Por exemplo, o SW-USS pode responder as operational intents em `https://oi.empresa-a.com.br` e os dados do Remote ID em `https://isa.empresa-a.com.br`, desde que cada referência registre a URL certa. Em todos os casos:

    - A URL base precisa ser acessível publicamente na internet e não pode terminar com `/`.
    - Os caminhos deste arquivo são acrescentados à URL base. Ex.: com `https://oi.empresa-a.com.br`, os detalhes ficam em `https://oi.empresa-a.com.br/uss/v1/operational_intents/{entityid}`.
    - O domínio de cada URL base é o `aud` dos tokens enviados a ela: quem chama pede o token com `intended_audience` igual a esse domínio, e a parte do seu SW-USS que responde nele confere que o `aud` é o seu próprio domínio.

    ## Remote ID: Service Provider e Display Provider

    O Remote ID em rede (ASTM F3411) tem dois papéis, que o mesmo SW-USS pode exercer:

    - **Service Provider:** o papel de quem gerencia os voos. Durante o voo, recebe as posições dos seus drones e as fornece a quem pede, em `GET /uss/flights` e `GET /uss/flights/{id}/details`. Para ser encontrado, declara no DSS, por meio de uma Identification Service Area (ISA), a área e o intervalo de tempo em que tem voos. **No BR-UTM, todo SW-USS é Service Provider dos seus voos: fornecer a telemetria dos drones em operações ativas é obrigatório.**
    - **Display Provider:** o papel de quem mostra o tráfego. Agrega os dados de Remote ID de todos os Service Providers que têm voos numa área e os entrega a um aplicativo de exibição (por exemplo, um mapa). Descobre os Service Providers da área pelas ISAs no DSS, é avisado de ISAs novas pelas suas subscriptions do Remote ID (`POST /uss/identification_service_areas/{id}`) e consulta `GET /uss/flights` em cada um. **No BR-UTM, ser Display Provider é opcional:** consumir a telemetria de outros SW-USS é recomendado, mas não obrigatório. O DECEA acompanha o tráfego dessa forma.

    ## Requisitos de implementação

    O que o SW-USS precisa fazer para operar no BR-UTM, organizado como sugestões de operações. Os endpoints deste arquivo são os exigidos para a interoperabilidade, não os únicos que o SW-USS pode ter.

    1. **Interface do operador.** É por onde o operador pede, acompanha, ativa e encerra voos. A forma fica a critério da empresa: interfaces gráficas, uma API própria de planejamento de voo, integração com estações de controle de solo etc. O BR-UTM não padroniza esta parte.
    2. **Planejamento e desconflitação.** Para cada pedido de voo:
       - Verifique se a posição do voo está estritamente dentro de uma Zona UTM a que o SW-USS tem acesso (Provedor de Zona UTM, ver `provedor-zona-utm.yaml`).
       - Consulte no DSS as operational intents e as constraints da área, e busque os detalhes nos SW-USS que as gerenciam e no Gerenciador de Constraints.
       - Verifique os conflitos com os volumes exatos. Uma operational intent pode ser criada (`Accepted`) mesmo intersectando outra, qualquer que seja a prioridade das duas; a regra de interseção vale na ativação (abaixo), seja o voo VLOS, EVLOS ou BVLOS. Volumes que só se encostam não conflitam. Em Zona UTM do tipo U1, use prioridade `1`.
       - Crie a operational intent reference no DSS (`Accepted`), com uma subscription que notifica constraints, e notifique os subscribers.

       Antes de ativar, verifique tudo de novo. O DSS não rejeita a ativação de operational intents que se intersectam: cabe ao SW-USS verificar. Uma operational intent não pode ser ativada enquanto intersectar outra que já foi ativada, de prioridade igual ou maior: entre operational intents de mesma prioridade, vale a que foi ativada primeiro; entre prioridades diferentes, a de prioridade maior pode ser ativada mesmo intersectando uma de prioridade menor (ver o schema `Priority`). Uma operational intent que intersecta uma constraint não pode ser ativada.
    3. **Atendimento aos outros participantes.** O SW-USS responde aos endpoints deste arquivo: fornece os detalhes das suas operational intents a quem os pede, recebe as notificações de mudança em operational intents e constraints da área e fornece a telemetria dos seus voos ao Remote ID. Cada endpoint diz quem o chama.
    4. **Dados das operações.**
       - Das suas operational intents, o SW-USS mantém os detalhes completos, o OVN atual, a versão e a subscription, para responder aos pedidos de detalhes e alterá-las no DSS.
       - As operational intents e constraints de outros, recebidas por notificação ou consulta, não precisam ser guardadas. Mas o SW-USS deve usá-las para adaptar as operações afetadas e fazer a coordenação estratégica: por exemplo, avisar o operador de um novo conflito ou de uma constraint que impede a ativação.
       - Se uma constraint, ou uma operational intent de prioridade maior, intersectar uma operação sua, o SW-USS altera a operação para eliminar a interseção ou a encerra. Se a operação estiver `Activated`, o prazo é de cinco minutos, contados do recebimento da notificação (mesmo que a constraint ou a outra operação só comece depois) ou de quando o SW-USS encontra a interseção numa consulta: nesse prazo, a operational intent é alterada ou encerrada no DSS e o drone sai da interseção ou pousa. O prazo não vale para `Nonconforming` e `Contingent`, estados que já tratam de problemas na operação.
       - Para o Remote ID, o SW-USS mantém a telemetria recente de cada voo ativo.
    5. **Monitoramento de conformidade.** Durante o voo, o SW-USS compara continuamente a telemetria do drone com os volumes da operational intent ativa:
       - Drone dentro dos volumes: a operational intent fica em `Activated`.
       - Drone fora dos volumes: a operational intent passa para `Nonconforming`. Ela mantém `volumes` e ganha `off_nominal_volumes`.
       - Drone de volta aos volumes: a operational intent volta para `Activated`.
       - Drone fora dos volumes por mais de 60 segundos: a operational intent passa para `Contingent`, com `volumes` vazio e só `off_nominal_volumes`. De `Contingent` não há volta.

       O tamanho e a forma dos `off_nominal_volumes` ficam a critério do SW-USS. A ideia é que eles cubram uma área maior que a original, para que mais operações próximas sejam notificadas de que um drone saiu do planejado. Cada mudança de estado é atualizada no DSS (o que exige o escopo `utm.conformance_monitoring_sa`) e notificada aos subscribers.
    6. **Remote ID (Service Provider).** Ao ativar a operational intent, o SW-USS cria a ISA no DSS. Durante o voo, serve a telemetria em `GET /uss/flights` e `GET /uss/flights/{id}/details`, atualizada no mínimo a cada 10 segundos. Ao fim do voo, remove a operational intent e a ISA.
    7. **Tokens para chamar o ECO-UTM.** O SW-USS obtém tokens em `GET /token` (ver `token.yaml`), com `intended_audience` igual ao domínio de quem será chamado (só o domínio, sem esquema, porta ou caminho). Um token pode levar vários escopos, separados por espaço, e todos eles devem ser considerados: ao pedir o token, inclua todos os escopos que as chamadas vão exigir. O token vale 1 hora; guardá-lo até perto do `exp` evita pedidos desnecessários.
    8. **Validação dos tokens recebidos.** Em toda requisição: assinatura conferida com o JWKS do Auth Server, `iss` igual a `ICEA`, `aud` igual ao domínio em que a requisição chegou, `exp` no futuro e `scope` com o escopo exigido pelo endpoint. Divida a claim `scope` pelos espaços e aceite o token se o escopo exigido estiver entre os valores; não compare a string inteira.
    9. **Notificador.** Depois de cada criação, mudança de estado, alteração ou remoção no DSS, o SW-USS notifica cada SW-USS listado em `subscribers`. Se um deles estiver fora do ar, não é preciso repetir a chamada nem desistir da operação: o SW-USS declara esse SW-USS `Down` no DSS (item 12).
    10. **Relógio.** Sincronizado por NTP. Por enquanto, o servidor NTP usado é `a.ntp.br`.
    11. **Logs.** O SW-USS registra os logs do sistema inteiro, de todas as suas partes e domínios, e os organiza em log sets (ver "Logs e ocorrências").
    12. **Disponibilidade.** O SW-USS informa ao DSS, em `PUT /dss/v1/uss_availability/{uss_id}` (ver `dss.yaml`), a própria disponibilidade e a de outro SW-USS que esteja fora do ar: se não conseguir obter de outro SW-USS o OVN de uma operational intent dele, ou notificá-lo, declara esse SW-USS `Down`, e o DSS passa a aceitar a operational intent reference sem esse OVN, nos casos descritos em `PUT /dss/v1/uss_availability/{uss_id}`. As duas coisas são obrigatórias: todo SW-USS em produção recebe o escopo `utm.availability_arbitration`.

    Se o SW-USS ficar fora do ar durante um voo ativo, sem conseguir se comunicar com o ECO-UTM (o conjunto dos serviços do BR-UTM e de todos os SW-USS), ele deve cancelar todas as operações e orientar o operador a pousar os drones.

    ## Logs e ocorrências

    O SW-USS registra os logs do sistema inteiro, de todas as suas partes e domínios. Isso inclui: as mensagens trocadas com qualquer participante do ECO-UTM (o Auth Server, o DSS, o Provedor de Zona UTM, os Gerenciadores de Constraints, os outros SW-USS etc.), nos dois sentidos, inclusive as que ficaram sem resposta, e não só as trocadas com o DSS e com outros SW-USS, que a ASTM F3548-21 (§5.9) pede; os avisos dados ao operador e as entradas dele; qual operador é responsável por cada operational intent; as tentativas de planejamento negadas por conflito; e as posições do drone usadas no monitoramento de conformidade. Todos os horários ficam em UTC, sem ajuste local, e correspondem ao momento do evento.

    Os logs são organizados em **log sets**, que o DECEA lista em `GET /uss/v1/log_sets` e obtém em `GET /uss/v1/log_sets/{log_set_id}`:

    - **Log set de operação** (`type: operational_intent`): um por operational intent, com `log_set_id` igual ao `entityid` dela. Reúne tudo o que aconteceu na operação, do planejamento ao encerramento.
    - **Log set de ocorrência** (`type: ocorrencia`): um por ocorrência, com `log_set_id` igual a um UUIDv4 gerado pelo SW-USS quando detecta a ocorrência. Reúne os logs ligados a ela, as operational intents envolvidas e uma descrição do que aconteceu.

    **Ocorrências.** A ICA 100-48 (Art. 40) obriga o SW-USS a notificar toda ocorrência, e considera ocorrências:

    1. extrapolar o próprio volume operacional (`extrapolar_volume_operacional`), por exemplo quando o drone sai dos volumes e a operational intent passa para `Nonconforming`;
    2. ingressar inadvertidamente em outro volume operacional (`ingressar_outro_volume_operacional`);
    3. impactar a operação de uma aeronave tripulada (`impactar_aeronave_tripulada`);
    4. perder a conectividade entre o operador UAS e o SW-USS (`perda_conectividade_operador`).

    Crie o log set da ocorrência assim que ela for detectada. A forma de notificar o DECEA de cada ocorrência ainda não foi definida; enquanto isso, ela fica disponível na listagem de log sets.

    **Retenção.** Pela ICA 100-48 (Art. 39), os dados ficam guardados por até 30 dias corridos e, em caso de incidente ou de pedido de investigação, por até 5 anos.

    ## Autenticação

    Os outros participantes chamam o seu SW-USS com `Authorization: Bearer <token>`, um token emitido pelo Auth Server do BR-UTM com `aud` igual ao domínio chamado. Cada operação informa, no início da descrição e em `security`, o escopo que o token de quem chama precisa ter, e quem costuma chamá-la. Responda `401` a um token ausente ou inválido e `403` a um token sem o escopo exigido.

    ## Schemas

    Schemas do Remote ID com o mesmo nome de um schema UTM, mas conteúdo diferente, recebem o prefixo `Rid` (ex.: `RidVolume4D`).
servers:
- url: '{uss_base_url}'
  description: URL base do SW-USS, a mesma registrada no DSS
  variables:
    uss_base_url:
      default: https://uss.empresa-a.com.br/utm
      description: URL base do SW-USS, sem `/` no fim
security:
- Authority:
  - utm.strategic_coordination
  - utm.conformance_monitoring_sa
  - utm.aviation_authority
  - utm.constraint_management
  - utm.constraint_processing
  - utm.availability_arbitration
  - rid.display_provider
  - rid.service_provider
tags:
- name: Operational Intents
  description: >-
    Endpoints de operational intents: o SW-USS fornece os detalhes e a telemetria das suas operational intents e recebe as notificações de mudança nas operational intents de outros SW-USS.
- name: Constraints
  description: >-
    Endpoint em que o SW-USS recebe as notificações de mudança em constraints.
- name: Reports
  description: Endpoint em que o SW-USS recebe relatos de problemas.
- name: Logs
  description: >-
    Endpoints em que o DECEA obtém os logs do SW-USS.
- name: Remote ID (Service Provider)
  description: 'Endpoints que o SW-USS expõe como Service Provider do Remote ID: fornece a telemetria e os detalhes dos seus voos.'
- name: Remote ID (Display Provider)
  description: 'Endpoint que o SW-USS expõe se for Display Provider do Remote ID: recebe as notificações de ISAs na área das suas subscriptions do Remote ID.'
paths:
  /uss/v1/operational_intents/{entityid}:
    summary: Consulta os detalhes de uma operational intent em um SW-USS.
    parameters:
    - name: entityid
      description: EntityID da operational intent.
      schema:
        $ref: '#/components/schemas/EntityID'
      in: path
      required: true
    get:
      tags:
      - Operational Intents
      security:
      - Authority:
        - utm.strategic_coordination
      summary: Fornece os detalhes de uma operational intent
      description: |
        **Escopo exigido no token de quem chama:** `utm.strategic_coordination`

        **Quem chama:** outros SW-USS que encontraram a operational intent no DSS.

        Devolve os detalhes (e a referência) de uma operational intent gerenciada pelo seu SW-USS. Os outros SW-USS chamam este endpoint depois de encontrar a referência no DSS, para obter os volumes exatos, a prioridade e o OVN, que eles vão incluir na `key` ao criar ou alterar as próprias operational intents.

        - Devolva a última versão que o DSS aceitou. Enquanto uma alteração no DSS estiver pendente, continue devolvendo a versão anterior; antes de o DSS confirmar a criação, responda `404`.
        - Preencha `reference.ovn` com o OVN atual: é com ele que os outros SW-USS provam ao DSS que leram a sua operational intent.
        - Preencha `details.volumes` e `details.off_nominal_volumes` de acordo com o estado (ver o schema `OperationalIntentDetails`).
        - Responda `404` se o ID não for de uma operational intent gerenciada pelo seu SW-USS.

        No BR-UTM, este endpoint é obrigatório.
      operationId: getOperationalIntentDetails
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOperationalIntentDetailsResponse'
              examples:
                ativa:
                  summary: Operational intent ativa da empresa-a
                  value:
                    operational_intent:
                      reference:
                        id: 2f8343be-6482-4d1b-a474-16847e01af1e
                        manager: empresa-a
                        uss_availability: Unknown
                        version: 2
                        state: Activated
                        ovn: 6LsTWURy3osoT7kkrJc3VuPyGbuc7TOK0l7kfkv8hYI_
                        time_start: &id001
                          value: '2026-11-05T14:00:00Z'
                          format: RFC3339
                        time_end: &id002
                          value: '2026-11-05T14:30:00Z'
                          format: RFC3339
                        uss_base_url: https://uss.empresa-a.com.br/utm
                        subscription_id: 78ea3fe8-71c2-4f5c-9b44-9c02f5563c6f
                      details:
                        volumes:
                        - &id003
                          volume: &id004
                            outline_polygon:
                              vertices:
                              - lat: -23.55
                                lng: -46.64
                              - lat: -23.55
                                lng: -46.63
                              - lat: -23.54
                                lng: -46.63
                              - lat: -23.54
                                lng: -46.64
                            altitude_lower:
                              value: 0
                              reference: W84
                              units: M
                            altitude_upper:
                              value: 120
                              reference: W84
                              units: M
                          time_start:
                            value: '2026-11-05T14:00:00Z'
                            format: RFC3339
                          time_end:
                            value: '2026-11-05T14:30:00Z'
                            format: RFC3339
                        off_nominal_volumes: []
                        priority: 1
                        flight_type: VLOS
          description: Os detalhes da operational intent foram obtidos com sucesso.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Um ou mais parâmetros de entrada estão ausentes ou inválidos.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A entidade solicitada não foi encontrada.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O cliente fez requisições demais em pouco tempo.
  /uss/v1/operational_intents/{entityid}/telemetry:
    summary: >-
      Posição detalhada de uma operational intent fora do normal.
    parameters:
    - name: entityid
      description: EntityID da operational intent.
      schema:
        $ref: '#/components/schemas/EntityID'
      in: path
      required: true
    get:
      tags:
      - Operational Intents
      security:
      - Authority:
        - utm.conformance_monitoring_sa
      summary: >-
        Fornece a telemetria de uma operational intent fora do normal
      operationId: getOperationalIntentTelemetry
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOperationalIntentTelemetryResponse'
              examples:
                foraDoVolume:
                  summary: Drone fora dos volumes (Nonconforming)
                  value:
                    operational_intent_id: 2f8343be-6482-4d1b-a474-16847e01af1e
                    telemetry: &id006
                      time_measured:
                        value: '2026-11-05T14:12:31Z'
                        format: RFC3339
                      position:
                        longitude: -46.6305
                        latitude: -23.5395
                        accuracy_h: HA3m
                        accuracy_v: VA3m
                        extrapolated: false
                        altitude:
                          value: 100
                          reference: W84
                          units: M
                      velocity:
                        speed: 8.5
                        units_speed: MetersPerSecond
                        track: 45
                    next_telemetry_opportunity:
                      value: '2026-11-05T14:12:32Z'
                      format: RFC3339
          description: >-
            A telemetria da operational intent foi obtida com sucesso.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Um ou mais parâmetros de entrada estão ausentes ou inválidos.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A entidade solicitada não foi encontrada.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            A operational intent não está em um estado que fornece telemetria.
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Não há telemetria disponível.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            O cliente fez requisições demais em pouco tempo.
      description: |
        **Escopo exigido no token de quem chama:** `utm.conformance_monitoring_sa`

        **Quem chama:** outros SW-USS que acompanham uma operational intent em `Nonconforming` ou `Contingent`.

        Devolve a posição mais recente do drone de uma operational intent em `Nonconforming` ou `Contingent`, para que os outros SW-USS acompanhem a situação.

        - Responda `409` se a operational intent não estiver em `Nonconforming` ou `Contingent`, e `412` se não houver telemetria disponível.
        - Informe em `next_telemetry_opportunity` quando deve haver uma posição nova.

        No BR-UTM, a obrigatoriedade deste endpoint ainda não foi definida.
  /uss/v1/operational_intents:
    summary: >-
      Detalhes de operational intents mantidos por um SW-USS.
    post:
      tags:
      - Operational Intents
      security:
      - Authority:
        - utm.strategic_coordination
      summary: Recebe a notificação de mudança em uma operational intent
      operationId: notifyOperationalIntentDetailsChanged
      description: |
        **Escopo exigido no token de quem chama:** `utm.strategic_coordination`

        **Quem chama:** o SW-USS que criou, alterou ou removeu uma operational intent na área de uma subscription sua.

        Recebe de outro SW-USS os detalhes de uma operational intent criada, alterada (inclusive de estado) ou removida em uma área coberta por uma subscription do seu SW-USS. Quem alterou a operational intent chama este endpoint em cada SW-USS listado em `subscribers` pelo DSS.

        - Com `operational_intent` preenchido: use os detalhes para adaptar as suas operações afetadas e fazer a coordenação estratégica. Não é obrigatório guardá-los; o OVN atual (`operational_intent.reference.ovn`), que vai na `key`, também pode ser obtido de novo com o SW-USS que gerencia a operational intent. Se a operational intent recebida tiver prioridade maior e intersectar uma operação sua, altere a sua operação para eliminar a interseção ou encerre-a. Se ela estiver `Activated`, o prazo é de cinco minutos depois de receber esta notificação, e nesse prazo o drone também sai da interseção ou pousa.
        - Sem `operational_intent`: a operational intent foi removida.
        - `subscriptions` traz o `notification_index` de cada subscription sua que motivou a notificação. Um salto no índice indica notificações perdidas; nesse caso, consulte o DSS de novo.
        - Responda `409` se a versão recebida for menor que a de uma notificação já recebida.
        - Responda `204` assim que receber a notificação; a avaliação do impacto nas suas operações pode vir depois.

        **No sentido contrário:** depois de cada criação, mudança de estado, alteração ou remoção de uma operational intent sua no DSS, o seu SW-USS chama este endpoint em cada SW-USS listado em `subscribers`, com um token cujo `aud` é o domínio de cada um. Se um deles estiver fora do ar, não é preciso repetir a chamada nem desistir da operação: declare esse SW-USS `Down` no DSS (`PUT /dss/v1/uss_availability/{uss_id}`).

        No BR-UTM, este endpoint é obrigatório.
      requestBody:
