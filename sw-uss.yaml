      operationId: getLogSet
      description: |
        **Escopo exigido no token de quem chama:** `utm.aviation_authority`

        **Quem chama:** o DECEA.

        Devolve os logs de um log set, no formato comum de exportação da ASTM F3548-21 (Anexo A3). São os logs do sistema inteiro (todas as partes e domínios do SW-USS) ligados ao log set:

        - `messages`: mensagens trocadas com qualquer participante do ECO-UTM, nos dois sentidos, inclusive as que ficaram sem resposta;
