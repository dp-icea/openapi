                        time_start:
                          value: '2026-11-05T14:12:30Z'
                          format: RFC3339
                        time_end:
                          value: '2026-11-05T14:30:00Z'
                          format: RFC3339
                      priority: 1
                      flight_type: VLOS
                  subscriptions:
                  - subscription_id: 0b6d2c4e-8f1a-4e3b-a5c7-9d1f3e5b7a29
                    notification_index: 9
              removida:
                summary: A empresa-a avisa que a sua operational intent foi removida
                value:
                  operational_intent_id: 2f8343be-6482-4d1b-a474-16847e01af1e
                  subscriptions:
                  - subscription_id: 0b6d2c4e-8f1a-4e3b-a5c7-9d1f3e5b7a29
                    notification_index: 10
        required: true
      responses:
        '204':
          description: >-
            As informações completas, novas ou atualizadas, da operational intent foram recebidas com sucesso.
        '400':
          content:
            application/json:
