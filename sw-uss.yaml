  /uss/v1/constraints:
    summary: Notificações de mudança em constraints, recebidas pelo SW-USS.
    post:
      tags:
      - Constraints
      security:
      - Authority:
        - utm.constraint_management
      summary: Recebe a notificação de mudança em uma constraint
      operationId: notifyConstraintDetailsChanged
      description: |
        **Escopo exigido no token de quem chama:** `utm.constraint_management`

        **Quem chama:** o SW-USS Gerenciador de Constraints (na Fase 1, o DECEA).

        Recebe os detalhes de uma constraint criada, alterada ou removida em uma área coberta por uma subscription do seu SW-USS com `notify_for_constraints: true`.

        - Com `constraint` preenchido: use os detalhes para adaptar as suas operações afetadas. Não é obrigatório guardá-los; o OVN atual (`constraint.reference.ovn`), que vai na `key`, também pode ser obtido de novo com o Gerenciador de Constraints.
        - Sem `constraint`: a constraint foi removida.
        - Verifique se a constraint intersecta alguma das suas operational intents: uma operational intent que intersecta uma constraint não pode ser ativada, e uma operação afetada é alterada para eliminar a interseção ou encerrada. Se a operação estiver `Activated`, o prazo é de cinco minutos depois de receber esta notificação, mesmo que a constraint só comece depois, e nesse prazo o drone também sai da interseção ou pousa.

        No BR-UTM, este endpoint é obrigatório.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutConstraintDetailsParameters'
            examples:
