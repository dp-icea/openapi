  /uss/v1/log_sets:
    summary: Log sets do SW-USS.
    get:
      tags:
      - Logs
      summary: Lista os log sets do SW-USS
      operationId: listLogSets
      description: |
        **Escopo exigido no token de quem chama:** `utm.aviation_authority`

        **Quem chama:** o DECEA.

        Lista os log sets que o SW-USS ainda guarda, para que o DECEA encontre os logs de uma operação ou de uma ocorrência e depois os obtenha em `GET /uss/v1/log_sets/{log_set_id}`.

        - Log sets de operação (`type: operational_intent`): um por operational intent, com `log_set_id` igual ao `entityid` dela.
        - Log sets de ocorrência (`type: ocorrencia`): um por ocorrência da ICA 100-48 (Art. 40), com `log_set_id` igual a um UUIDv4 gerado pelo SW-USS quando detecta a ocorrência.

        Todos os filtros são opcionais e se combinam: `time_start` e `time_end` devolvem os log sets cujo período se sobrepõe ao pedido; `type` e `operational_intent_id` restringem o tipo e a operação. Sem filtros, o SW-USS devolve todos os log sets que ainda guarda.
      parameters:
      - name: time_start
        in: query
        required: false
        description: Devolve só os log sets cujo período termina depois deste instante. RFC 3339, fuso 'Z'.
        schema:
          type: string
          format: date-time
        example: '2026-11-05T00:00:00Z'
      - name: time_end
        in: query
        required: false
        description: Devolve só os log sets cujo período começa antes deste instante. RFC 3339, fuso 'Z'.
        schema:
          type: string
          format: date-time
        example: '2026-11-06T00:00:00Z'
      - name: type
        in: query
        required: false
        description: Devolve só os log sets deste tipo.
        schema:
          $ref: '#/components/schemas/LogSetType'
        example: ocorrencia
      - name: operational_intent_id
        in: query
        required: false
        description: Devolve só os log sets que se referem a esta operational intent.
        schema:
          $ref: '#/components/schemas/EntityID'
        example: 2f8343be-6482-4d1b-a474-16847e01af1e
      responses:
        '200':
          description: Os log sets foram obtidos com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLogSetsResponse'
              examples:
                doisLogSets:
                  summary: Um log set de operação e um de ocorrência
                  value:
                    log_sets:
                    - log_set_id: 2f8343be-6482-4d1b-a474-16847e01af1e
                      type: operational_intent
                      operational_intent_ids:
                      - 2f8343be-6482-4d1b-a474-16847e01af1e
                      time_start:
                        value: '2026-11-05T13:40:00Z'
                        format: RFC3339
                      time_end:
                        value: '2026-11-05T14:31:00Z'
                        format: RFC3339
                      description: Operação de inspeção de telhado, do planejamento ao encerramento.
                    - log_set_id: 9c1e4b7a-3d2f-4e8b-a6c1-5f7d9b2e4a10
                      type: ocorrencia
                      ocorrencia: extrapolar_volume_operacional
                      operational_intent_ids:
                      - 2f8343be-6482-4d1b-a474-16847e01af1e
                      time_start:
                        value: '2026-11-05T14:12:30Z'
                        format: RFC3339
                      time_end:
                        value: '2026-11-05T14:12:55Z'
                        format: RFC3339
                      description: O drone saiu dos volumes planejados por 25 segundos e voltou.
        '400':
          description: Um ou mais parâmetros estão inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: O token de acesso Bearer não foi enviado no header `Authorization`, não pôde ser decodificado ou é inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: O token de acesso foi decodificado, mas não contém um escopo adequado a este endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: &id007
      - Authority:
        - utm.aviation_authority
  /uss/v1/log_sets/{log_set_id}:
    summary: Um log set do SW-USS.
    parameters:
    - name: log_set_id
      description: >-
        ID do log set, obtido em `GET /uss/v1/log_sets`: o `entityid` da operational intent, nos log sets de operação, ou o UUIDv4 gerado pelo SW-USS, nos de ocorrência.
      schema:
